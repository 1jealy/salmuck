:root {
  --page: #1b1f27;
  --box: #0d1015;
  --line: #f2efe6;
  --text: #f4f1e8;
  --dim: #a9b1bb;
  --yellow: #ffd84a;
  --red: #ff6b6b;
  --orange: #ffa94d;
  --green: #69db7c;
  --font: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  color-scheme: dark;
}

html, body { height: auto; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.75;
  word-break: keep-all;
  overflow-wrap: anywhere;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
  -webkit-font-smoothing: none;
}

[hidden] { display: none !important; }

.app { max-width: 520px; margin: 0 auto; }
.screen { display: flex; flex-direction: column; gap: 14px; }

.box {
  background: var(--box);
  border: 3px solid var(--line);
  box-shadow: 0 0 0 3px var(--box);
  padding: 14px 16px;
  margin: 3px;
}
.dim { color: var(--dim); }
b { color: var(--yellow); font-weight: 700; }

/* 시작 화면 */
.intro { display: flex; flex-direction: column; gap: 10px; }
.intro p { margin: 0; }
.intro h1 {
  margin: 4px 0;
  font-size: 44px;
  line-height: 1.2;
  font-weight: 700;
  color: var(--yellow);
  text-shadow: 3px 3px 0 #6b4f00;
}
.field { display: block; margin-bottom: 6px; }
input {
  font: inherit;
  font-size: 24px;
  letter-spacing: 0.15em;
  width: 100%;
  max-width: 240px;
  box-sizing: border-box;
  padding: 8px 10px;
  background: #000;
  color: var(--text);
  border: 3px solid var(--dim);
  border-radius: 0;
  margin-bottom: 10px;
}
input:focus-visible { outline: none; border-color: var(--yellow); }
input::placeholder { color: #6c737c; font-size: 17px; letter-spacing: 0; }
.rules p { margin: 0 0 10px; }
.rules p:last-child { margin-bottom: 0; }

/* 메뉴(선택지) */
.menu { display: flex; flex-direction: column; gap: 2px; }
.menu .item {
  font: inherit;
  font-size: 18px;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 48px;
  padding: 6px 8px 6px 30px;
  background: transparent;
  color: var(--text);
  border: 0;
  cursor: pointer;
  position: relative;
}
.menu .item::before { content: "▶"; position: absolute; left: 6px; color: transparent; }
.menu .item:hover:not(:disabled)::before,
.menu .item:focus-visible::before { color: var(--yellow); }
.menu .item:hover:not(:disabled), .menu .item:focus-visible { background: #1f2530; outline: none; }
.menu .item:disabled { color: #5d646e; cursor: not-allowed; }
.menu .item .cost { color: var(--dim); font-size: 15px; white-space: nowrap; }
.menu .item.main { color: var(--yellow); }
.menu .item.danger { color: var(--red); }
.menu .sep { height: 2px; background: #2c333e; margin: 6px 0; }
.menu .menu-label { color: var(--dim); font-size: 15px; padding: 2px 8px; }

/* HUD */
.hud {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  align-items: baseline;
  padding: 8px 14px;
  font-size: 16px;
}
.hud .time { font-size: 22px; color: var(--yellow); }
.hud .warn { color: var(--red); }

/* 장면 */
#scene, #result-scene {
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 240 / 204;
  image-rendering: pixelated;
  border: 3px solid var(--line);
  box-shadow: 0 0 0 3px var(--box);
  margin: 3px;
  width: calc(100% - 6px);
  box-sizing: border-box;
  touch-action: manipulation;
  cursor: pointer;
}
#result-scene { cursor: default; }

/* 좌석 버튼 */
.seat-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.seat-grid button {
  font: inherit;
  font-size: 17px;
  min-height: 44px;
  background: var(--box);
  color: var(--text);
  border: 2px solid #4a525e;
  border-radius: 0;
  cursor: pointer;
  position: relative;
  padding: 0;
}
.seat-grid button[aria-pressed="true"] { border-color: var(--yellow); color: var(--yellow); background: #2a2410; }
.seat-grid button.flagged::after { content: "!"; position: absolute; top: 0; right: 4px; color: var(--yellow); font-size: 14px; }
.seat-grid button.out { color: #5d646e; text-decoration: line-through; }
.seat-grid button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; }

/* 대화창 */
.dialog { min-height: 112px; font-size: 18px; }
.dialog p { margin: 0 0 10px; }
.dialog p:last-child { margin-bottom: 0; }
.dialog .who { color: var(--yellow); margin-right: 6px; }
.dialog .t { color: var(--dim); font-size: 15px; margin-right: 8px; }
.k-found, .k-caught { color: var(--red); }
.k-prevent { color: var(--green); }
.k-alert { color: var(--orange); }
.k-period { color: var(--yellow); }
.k-ambient { color: var(--dim); }

/* 수첩 */
.notes h2, .box h2 { margin: 0 0 8px; font-size: 18px; color: var(--yellow); font-weight: 700; }
.notes ol, .log ol, .truth { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.notes li, .log li { font-size: 16px; }
.notes .t, .log .t { color: var(--dim); font-size: 14px; margin-right: 8px; }
.log summary { cursor: pointer; font-size: 17px; color: var(--dim); }
.log[open] summary { margin-bottom: 10px; color: var(--yellow); }

/* 결과 */
.result-head p { margin: 0; }
.grade { font-size: 30px; color: var(--text); }
.grade span { font-size: 72px; color: var(--yellow); line-height: 1.1; margin-right: 4px; text-shadow: 4px 4px 0 #6b4f00; }
.r-title { font-size: 22px; color: var(--yellow); margin-top: 4px !important; }
.truth li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; font-size: 16px; }
.truth .no { font-size: 18px; color: var(--dim); }
.truth .tag { display: inline-block; margin-right: 6px; }
.truth .tag.scheme { color: var(--red); }
.truth .tag.slip { color: var(--orange); }
.truth .tag.clean { color: var(--green); }
.truth .out { display: block; color: var(--yellow); }
.truth p { margin: 2px 0 0; color: var(--dim); }

/* 카드 */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(5, 7, 10, 0.92);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.overlay-inner { max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 10px; }
.overlay-inner img { width: 100%; height: auto; display: block; image-rendering: pixelated; }

/* 확대 그림 보기 */
.viewer { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; }
.viewer-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
#v-title { color: var(--yellow); font-size: 19px; }
#closeup {
  display: block;
  margin: 0 auto;
  max-width: 100%;
  width: 100%;
  aspect-ratio: 160 / 120;
  image-rendering: pixelated;
  background: #000;
}
.v-caption { margin: 0; min-height: 1.6em; font-size: 17px; }
.v-caption.k-found, .v-caption.k-caught { color: var(--red); }
.v-caption.k-clean { color: var(--orange); }
.v-caption.k-prevent { color: var(--green); }

/* 행동 버튼 */
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.act {
  font: inherit;
  font-size: 17px;
  min-height: 56px;
  padding: 8px 10px;
  background: var(--box);
  color: var(--text);
  border: 3px solid var(--line);
  border-radius: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  text-align: left;
  line-height: 1.3;
}
.act small { color: var(--dim); font-size: 14px; }
.act:hover:not(:disabled), .act:focus-visible { background: #1f2530; outline: none; border-color: var(--yellow); }
.act:disabled { color: #5d646e; border-color: #3a414b; cursor: not-allowed; }
.act.main { grid-column: 1 / -1; color: var(--yellow); align-items: center; }
.act.danger { color: var(--red); }
.act.flag[aria-pressed="true"] { color: var(--yellow); border-color: var(--yellow); }

/* 수첩 앨범 */
.album-box { padding: 10px 12px; }
.small { margin: 0 0 8px; font-size: 14px; }
.album { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.shot { flex: 0 0 auto; background: none; border: 2px solid #4a525e; padding: 0; cursor: pointer; color: var(--dim); font: inherit; font-size: 13px; }
.shot canvas { display: block; width: 104px; height: 78px; image-rendering: pixelated; }
.shot span { display: block; padding: 2px 4px; text-align: left; }
.shot[aria-current="true"] { border-color: var(--yellow); color: var(--yellow); }
.shot:focus-visible { outline: 2px solid var(--yellow); }

/* 이번 교시 */
.ticker { padding: 10px 12px; }
.ticker ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 16px; }
.ticker .t { color: var(--dim); font-size: 14px; margin-right: 8px; }

/* 결과 화면의 증거 그림 */
.truth canvas { display: block; width: 100%; max-width: 240px; aspect-ratio: 160 / 120; image-rendering: pixelated; margin-top: 6px; border: 2px solid #4a525e; }

</style>

function zipper(ctx, ramp, y0, y1) {
  for (let y = y0; y < y1; y++) px(ctx, 80, y, 1, 1, y % 2 ? '#a6acb4' : ramp[0]);
  px(ctx, 79, y0 + 4, 3, 1, '#c3c8cf');
  px(ctx, 80, y0 + 5, 1, 4, '#c3c8cf');
  px(ctx, 79, y0 + 9, 3, 1, '#7d838b');
}

function clothesDetail(ctx, v, cl, ramp) {
  if (cl.kind === 'uniform') {
    // 셔츠가 보이는 V자, 넥타이, 라펠
    for (let y = 60; y <= 77; y++) {
      const half = Math.max(0, Math.round((77 - y) * 0.5));
      px(ctx, 80 - half, y, half * 2 + 1, 1, cl.trim);
    }
    stamp(ctx, 77, 61, [
      '.kkkk.',
      'kttttk',
      '.kttk.',
      '.kttk.',
      'kthttk',
      'kttttk',
      'ktthtk',
      'kttttk',
      'kthttk',
      'kttttk',
      '.kttk.',
      '..kk..',
    ], { k: '#3a0f18', t: C.tie, h: C.tieHi });
    line(ctx, 69, 60, 80, 79, ramp[0]);
    line(ctx, 91, 60, 80, 79, ramp[0]);
    line(ctx, 68, 61, 78, 79, ramp[3]);
    line(ctx, 80, 79, 80, 97, ramp[0]);
  } else if (cl.kind === 'shirt') {
    // 뾰족한 칼라(좌우 대칭으로 찍는다)와 단추 여밈
    const wing = [[68, 'ooo'], [68, 'olllo'], [69, 'ollllo'], [70, 'olllo'], [72, 'ollo'], [74, 'oo']];
    const colCollar = { o: ramp[0], l: ramp[4] };
    wing.forEach(([x, row], i) => {
      stamp(ctx, x, 58 + i, [row], colCollar);
      stamp(ctx, 160 - x - row.length, 58 + i, [[...row].reverse().join('')], colCollar);
    });
    px(ctx, 78, 64, 1, 34, ramp[1]);
    px(ctx, 79, 64, 3, 34, ramp[3]);
    px(ctx, 82, 64, 1, 34, ramp[1]);
  } else if (cl.kind === 'hoodie') {
    zipper(ctx, ramp, 63, 98);
    // 끈
    line(ctx, 74, 62, 73, 74, C.white); px(ctx, 72, 75, 2, 2, '#cfd3d8');
    line(ctx, 86, 62, 87, 74, C.white); px(ctx, 87, 75, 2, 2, '#cfd3d8');
    // 앞주머니
    line(ctx, 62, 86, 98, 86, ramp[1]);
    line(ctx, 62, 86, 58, 97, ramp[1]);
    line(ctx, 98, 86, 102, 97, ramp[1]);
    line(ctx, 62, 87, 98, 87, ramp[3]);
  } else {
    // 패딩: 누빔선(살짝 휘어짐)과 지퍼
    [70, 78, 86, 94].forEach((y) => {
      for (let x = 45; x < 116; x++) {
        const bend = Math.abs(x - 80) > 20 ? 1 : 0;
        px(ctx, x, y + bend, 1, 1, ramp[1]);
        px(ctx, x, y + bend + 1, 1, 1, ramp[3]);
      }
    });
    zipper(ctx, ramp, 60, 98);
  }
}

function buttons(ctx, v, kind) {
  const list = BUTTONS[kind];
  if (!list) return;
  list.forEach(([x, y], i) => {
    const big = v.bigButton && i === 1;
    if (big) stamp(ctx, x - 3, y - 3, ['.bbbb.', 'bhbbbb', 'bbbbbb', 'bbbbsb', 'bbbbbb', '.bbbb.'], { b: C.button, h: C.buttonHi, s: C.shine });
    else if (kind === 'uniform') stamp(ctx, x - 1, y - 1, ['.g.', 'ghg', '.o.'], { g: '#c9a227', h: '#f3d870', o: '#7a5f10' });
    else stamp(ctx, x - 1, y - 1, ['.w.', 'wgw', '.w.'], { w: '#f4f4f0', g: '#a9aeb6' });
    const missing = v.sticker === 'missing' && i === 1;
    if (v.sticker === 'none' || missing) return;
    const peeled = v.sticker === 'peeled' && i === list.length - 1;
    stamp(ctx, x - 2, y - 2, peeled
      ? ['ohhhw', 'ossww', 'osssw', 'ossso', '.ooo.']
      : ['.hhh.', 'hsssh', 'sssss', 'ossso', '.ooo.'], { o: C.stickerOut, s: C.sticker, h: C.stickerHi, w: C.stickerBack });
  });
}

// ---------- 손목시계, 사인펜, 책상 물건 ----------
function watch(ctx, w, x, y) {
  px(ctx, x - 1, y + 2, 13, 7, C.strap);
  px(ctx, x - 1, y + 2, 13, 1, C.strapHi);
  if (w.type === 'digital') {
    stamp(ctx, x, y, [
      'kkkkkkkkkkk',
      'kllllllllll',
      'klgg.l.gglk',
      'klg.glg.glk',
      'klgg.l.gglk',
      'kllllllllll',
      'kkkkkkkkkkk',
    ].map((r) => r.padEnd(11, 'k')), { k: '#3a3a42', l: C.lcd, g: C.seg });
    return;
  }
  stamp(ctx, x, y - 1, [
    '...bbbbb...',
    '.bbfffffbb.',
    '.bfffffffb.',
    'bfffffffffb',
    'bfffffffffb',
    'bfffffffffb',
    'bfffffffffb',
    'bfffffffffb',
    '.bfffffffb.',
    '.bbfffffbb.',
    '...bbbbb...',
  ], { b: C.bezel, f: C.face });
  const cx = x + 5;
  const cy = y + 4;
  [0, 3, 6, 9].forEach((k) => {
    const a = (k / 12) * Math.PI * 2;
    px(ctx, cx + Math.round(Math.sin(a) * 4), cy - Math.round(Math.cos(a) * 4), 1, 1, C.tick);
  });
  const ma = (w.m / 60) * Math.PI * 2;
  const ha = (((w.h % 12) + w.m / 60) / 12) * Math.PI * 2;
  for (let r = 0; r <= 4; r++) px(ctx, cx + Math.round(Math.sin(ma) * r), cy - Math.round(Math.cos(ma) * r), 1, 1, C.hand);
  for (let r = 0; r <= 2; r++) px(ctx, cx + Math.round(Math.sin(ha) * r), cy - Math.round(Math.cos(ha) * r), 1, 1, C.handR);
}

function pen(ctx, fake, x, y, vertical) {
  if (vertical) {
    for (let i = 0; i < 22; i++) {
      const isCap = i < 7;
      px(ctx, x, y + i, 1, 1, isCap ? C.capHi : C.penHi);
      px(ctx, x + 1, y + i, 2, 1, isCap ? C.cap : C.pen);
    }
    if (!fake) px(ctx, x, y + 7, 3, 2, C.band);
    else px(ctx, x + 1, y, 1, 1, C.lens);
    return;
  }
  for (let i = 0; i < 26; i++) {
    const isCap = i >= 19;
    px(ctx, x + i, y, 1, 1, isCap ? C.capHi : C.penHi);
    px(ctx, x + i, y + 1, 1, 2, isCap ? C.cap : C.pen);
  }
  if (!fake) px(ctx, x + 16, y, 2, 3, C.band);
  else px(ctx, x + 25, y + 1, 1, 1, C.lens);
}

// 책상 위 물건은 위쪽이 좁은 사다리꼴로 찍어 책상 면에 누워 있게 보이게 한다.
function trap(ctx, t, color) {
  for (let y = t.y0; y <= t.y1; y++) {
    const [l, r] = span(t, y);
    px(ctx, l, y, r - l + 1, 1, color);
  }
}

function span(t, y) {
  const k = (y - t.y0) / Math.max(1, t.y1 - t.y0);
  return [Math.round(t.l0 + (t.l1 - t.l0) * k), Math.round(t.r0 + (t.r1 - t.r0) * k)];
}

// 사다리꼴 안의 상대 좌표(u: 0~1 가로, w: 0~1 세로) → 화면 좌표
function at(t, u, w) {
  const y = Math.round(t.y0 + (t.y1 - t.y0) * w);
  const [l, r] = span(t, y);
  return [Math.round(l + (r - l) * u), y];
}

const PAPER = { y0: 99, y1: 118, l0: 48, r0: 86, l1: 43, r1: 91 };
const OMR = { y0: 99, y1: 118, l0: 120, r0: 152, l1: 117, r1: 156 };
const CARD = { y0: 101, y1: 115, l0: 9, r0: 25, l1: 6, r1: 27 };

function desk(ctx, v) {
  if (v.paper !== 'none') {
    // 문제지
    trap(ctx, { ...PAPER, y0: PAPER.y0 + 1, y1: PAPER.y1 + 1 }, C.paperEdge);
    trap(ctx, PAPER, C.paper);
    const [hx, hy] = at(PAPER, 0.08, 0.08);
    px(ctx, hx, hy, 14, 2, '#8a919c');
    for (let w = 0.3; w < 0.95; w += 0.16) {
      const [x0, y] = at(PAPER, 0.08, w);
      const [x1] = at(PAPER, 0.85 - ((w * 37) % 0.2), w);
      px(ctx, x0, y, x1 - x0, 1, C.print);
    }
    if (v.paper === 'scribbled') {
      [[0.15, 0.3, 0.4, 0.5, 0.6, 0.35], [0.5, 0.6, 0.7, 0.45, 0.9, 0.6], [0.1, 0.75, 0.3, 0.9, 0.45, 0.7], [0.55, 0.85, 0.7, 0.75, 0.88, 0.9]].forEach(([a, b, c, d, e, f]) => {
        const p1 = at(PAPER, a, b);
        const p2 = at(PAPER, c, d);
        const p3 = at(PAPER, e, f);
        line(ctx, p1[0], p1[1], p2[0], p2[1], C.pencil);
        line(ctx, p2[0], p2[1], p3[0], p3[1], C.pencil);
      });
      const [cx, cy] = at(PAPER, 0.75, 0.12);
      stamp(ctx, cx, cy, ['.pp.', 'p..p', '.pp.'], { p: C.pencil });
    }
    // OMR 카드
    trap(ctx, { ...OMR, y0: OMR.y0 + 1, y1: OMR.y1 + 1 }, C.omrEdge);
    trap(ctx, OMR, C.omr);
    trap(ctx, { ...OMR, y1: OMR.y0 + 1 }, C.omrLine);
    const filled = Math.round(v.omr * 20);
    let k = 0;
    for (let col = 0; col < 4; col++) {
      const u = 0.06 + col * 0.24;
      const top = at(OMR, u, 0.12);
      const bot = at(OMR, u, 0.95);
      line(ctx, top[0], top[1], bot[0], bot[1], C.omrLine);
      for (let row = 0; row < 5; row++) {
        const [x, y] = at(OMR, u + 0.04, 0.2 + row * 0.17);
        px(ctx, x, y, 5, 1, '#efb2c2');
        if (k < filled) px(ctx, x + ((k * 5) % 3) + 1, y - 1, 2, 2, C.mark);
        k++;
      }
    }
  }
  // 수험표
  trap(ctx, { ...CARD, y0: CARD.y0 + 1, y1: CARD.y1 + 1 }, C.cardEdge);
  trap(ctx, CARD, C.card);
  trap(ctx, { ...CARD, y1: CARD.y0 + 2 }, C.cardHead);
  const [px0, py0] = at(CARD, 0.12, 0.35);
  px(ctx, px0, py0, 6, 7, C.photoBg);
  const [lx, ly] = at(CARD, 0.55, 0.4);
  px(ctx, lx, ly, 7, 1, C.print);
  px(ctx, lx, ly + 3, 5, 1, C.print);
}

// ---------- 확대 창 ----------
function panel(ctx, x, y, w, h) {
  px(ctx, x - 1, y - 1, w + 2, h + 2, C.panel);

}

function glassesInset(ctx, g) {

function pocketsInset(ctx, items) {

    else stamp(ctx, 136, 25, ['.eeeeeeeeee.', 'ebbbbbbbbbbe', 'eeeeeeeeeeee', 'ebbbbbbbbbbe', 'ebbbbbbbbbbe', '.eeeeeeeeee.'], { e: C.budEdge, b: C.bud });
  });

// ---------- 공용 틀 (모든 학생이 같은 틀을 쓰고 색만 바꾼다) ----------
// 틀의 각 칸에는 실제 색 대신 'C0'~'C4'(옷), 'K0'~'K4'(피부), 'H0'~'H4'(머리), 'W0'~'W4'(책상) 같은 자리표시가 들어간다.
const SLOT = (k) => [0, 1, 2, 3, 4].map((i) => `${k}${i}`);
const TEMPLATE_CACHE = new Map();

function capsule(r, p, x0, y0, x1, y1, rad) {
  const dx = x1 - x0;
  const dy = y1 - y0;
  const len2 = dx * dx + dy * dy;
  r.fill(p, Math.floor(Math.min(x0, x1) - rad), Math.floor(Math.min(y0, y1) - rad), Math.ceil(Math.max(x0, x1) + rad), Math.ceil(Math.max(y0, y1) + rad), (x, y) => {
    const t = Math.max(0, Math.min(1, ((x + 0.5 - x0) * dx + (y + 0.5 - y0) * dy) / len2));
    const ex = x + 0.5 - (x0 + dx * t);
    const ey = y + 0.5 - (y0 + dy * t);
    return ex * ex + ey * ey <= rad * rad;
  });
}

function toMap(r) {
  const map = new Array(CLOSE_W * CLOSE_H).fill(null);
  r.render((x, y, c) => { map[y * CLOSE_W + x] = c; });
  return map;
}

function template(key, build) {
  if (!TEMPLATE_CACHE.has(key)) {
    const r = makeRaster(CLOSE_W, CLOSE_H);
    build(r);
    TEMPLATE_CACHE.set(key, toMap(r));
  }
  return TEMPLATE_CACHE.get(key);
}

// 얼굴형: 턱이 좁아지는 정도와 너비
const FACE_SHAPE = {
  oval: { rx: 20.5, narrow: 0.32, pow: 2 },
  round: { rx: 21, narrow: 0.18, pow: 2 },
  square: { rx: 20, narrow: 0.12, pow: 3 },
  narrow: { rx: 19, narrow: 0.36, pow: 2 },
};

// 몸 뒤쪽 층: 몸통(옷 실루엣 포함), 목, 귀, 머리, 책상, 책상 위가 아닌 팔
function bodyTemplate(pose, sleeves, waist, kind, shape, earsHidden) {
  return template(`body|${pose}|${sleeves}|${waist}|${kind}|${shape}|${earsHidden}`, (r) => {
    const cloth = SLOT('C');
    const skin = SLOT('K');
    // 몸통과 위팔을 한 덩어리로: 목에서 완만하게 내려오는 어깨선 → 둥근 어깨 끝 → 곧게 내려오는 팔 바깥선
    const pTorso = r.part(cloth);
    r.fill(pTorso, 30, 56, 130, 99, (x, y) => {
      const ax = Math.abs(x + 0.5 - 80);
      if (ax > 37) return false;
      let top;
      if (ax <= 9) top = 59.5;
      else if (ax <= 27) top = 59.5 + (ax - 9) * 0.3;
      else top = 64.9 + (1 - Math.sqrt(Math.max(0, 1 - ((ax - 27) / 10) ** 2))) * 10;
      return y >= top;
    });
    if (waist) r.ellipse(pTorso, 117, 90, 6, 6);
    // 옷 종류별 실루엣: 후드는 목 뒤로 접힌 모자, 패딩은 세운 깃
    if (kind === 'hoodie') {
      const pHood = r.part(cloth);
      r.fill(pHood, 56, 48, 104, 68, (x, y) => {
        const out = ((x + 0.5 - 80) / 23) ** 2 + ((y + 0.5 - 62) / 9) ** 2 <= 1;
        const hole = ((x + 0.5 - 80) / 13) ** 2 + ((y + 0.5 - 61) / 6) ** 2 <= 1;
        return out && !hole;
      });
    }
    if (kind === 'padding') {
      const pCollar = r.part(cloth);
      r.round(pCollar, 66, 53, 28, 11, 4);
    }
    // 목
    const pNeck = r.part(skin);
    r.round(pNeck, 72, 50, 16, kind === 'padding' ? 6 : 14, 3);
    // 귀: 작게, 머리 옆에 살짝만 보인다
    if (!earsHidden) {
      const pEars = r.part(skin);
      r.ellipse(pEars, 59, 38, 3, 5);
      r.ellipse(pEars, 101, 38, 3, 5);
    }
    // 머리: 얼굴형에 따라 턱 모양이 다르다
    const fs = FACE_SHAPE[shape] || FACE_SHAPE.oval;
    const pHead = r.part(skin, { shine: true });
    r.fill(pHead, 56, 10, 104, 58, (x, y) => {
      const ny = (y + 0.5 - 33) / 23;
      const narrow = ny > 0 ? 1 - ny * fs.narrow : 1;
      return Math.abs((x + 0.5 - 80) / (fs.rx * narrow)) ** fs.pow + Math.abs(ny) ** 2 <= 1;
    });
    if (kind === 'padding') { const pFront = r.part(cloth); r.round(pFront, 68, 56, 24, 8, 3); }
    // 책상
    const pDesk = r.part(WOOD.map((_, i) => `W${i}`), { flat: true });
    r.rect(pDesk, 0, 96, CLOSE_W, 24);
    const fore = sleeves ? skin : cloth;
    // 배 잡기: 양손으로 배를 감싸고 몸을 웅크린다
    if (pose === 'belly') {
      const pForeL = r.part(fore);
      capsule(r, pForeL, 47, 92, 70, 86, 4.8);
      const pForeR = r.part(fore);
      capsule(r, pForeR, 113, 92, 90, 86, 4.8);
      const pHands = r.part(skin, { shine: true });
      r.ellipse(pHands, 74, 85, 6, 4.5);
      r.ellipse(pHands, 86, 86, 6, 4.5);
    }
  });
}

// 몸 앞쪽 층: 책상 위에 앞으로 내민 아래팔과 손 (책상 물건 위에 그린다)
function armsTemplate(pose, sleeves) {
  return template(`arms|${pose}|${sleeves}`, (r) => {
    const cloth = SLOT('C');
    const skin = SLOT('K');
    if (pose === 'belly') return;
    const left = true;
    const right = pose !== 'glasses' && pose !== 'ear';
    const rightHand = pose === 'penUp' ? [107, 99] : [97, 105];
    if (left) {
      const pFore = r.part(sleeves ? skin : cloth);
      capsule(r, pFore, 48, 96, 58, 103, 5);
      if (sleeves) { const pCuff = r.part(cloth); r.ellipse(pCuff, 48, 95, 6, 3.5); }
      const pHand = r.part(skin, { shine: true });
      r.ellipse(pHand, 63, 105, 6.5, 4.5);
    }
    if (right) {
      const pFore = r.part(sleeves ? skin : cloth);
      capsule(r, pFore, 112, 96, rightHand[0] + 5, rightHand[1] - 2, 5);
      if (sleeves) { const pCuff = r.part(cloth); r.ellipse(pCuff, 112, 95, 6, 3.5); }
      const pHand = r.part(skin, { shine: true });
      r.ellipse(pHand, rightHand[0], rightHand[1], 6.5, 4.5);
    }
  });
}

// 얼굴로 올린 팔: 머리카락 위에 그려야 손가락이 가려지지 않는다.
// 팔꿈치는 가슴 옆, 아래팔은 얼굴 쪽으로 비스듬히, 손목에서 한 번 꺾여 손가락 끝이 안경테/귀에 닿는다.
function raisedArmTemplate(pose, sleeves) {
  return template(`raised|${pose}|${sleeves}`, (r) => {

  const g = String(r.grade);
  text(ctx, g, tx + 44, y + 6, 132, K.shadow, 700);
  const gw = text(ctx, g, tx + 40, y, 132, K.yellow, 700);
  text(ctx, '등급', tx + 56 + gw, y + 70, 55, K.text, 700);
  y += 160;
  text(ctx, r.title, tx + 40, y, 44, K.yellow, 700);
  y += 76;

  r.schemes.forEach((sc) => {
    const name = SCHEMES[sc.key].name;
    const line = sc.state === 'caught' ? `${sc.seat}번 ${name} 적발` : sc.state === 'flagged' ? `${sc.seat}번 ${name} 사후 조사` : `${sc.seat}번 ${name} 놓침`;
    text(ctx, line, tx + 40, y, 34, sc.state === 'missed' ? K.red : K.green);
    y += 50;
  });
  y += 8;
  text(ctx, `예방 ${r.prevented} · 처리 ${r.reported} · 봐줌 ${r.excused} · 놓침 ${r.missedSlip} · 민원 ${r.complaints}`, tx + 40, y, 30, K.dim);
  return canvas;
}

return { renderCard };
})();
// ---- src/main.js
const __main = (() => {
// 화면 연결: 교실 그림 → 확대 그림 → 행동 → 수첩(스냅숏 앨범)
const { PERIODS, PRECHECK } = __data;
const { newGame, precheck, canPrecheck, finishPrecheck, idCheck, canIdCheck, suspects, patrol, canPatrol, endExam, afterCheck, canAfterCheck, nextPeriod, resolvePending, toggleFlag, submitReport, truth, outcome, student, label, clockText, snapshots, normalizeRoom, randomRoom } = __game;
const { drawScene, seatAt, SCENE_W, SCENE_H } = __pixel;
const { drawCloseup, CLOSE_W, CLOSE_H } = __closeup;
const { renderCard } = __card;
const $ = (id) => document.getElementById(id);
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const sceneCtx = $('scene').getContext('2d');
const closeCtx = $('closeup').getContext('2d');

let state = null;
let selected = null;
let viewing = null; // 지금 확대 창에 띄운 log 번호
let caption = null; // 확대 창 아래 한 줄 { text, kind }
let cardBlob = null;

// ---------- 시작/화면 전환 ----------
function roomFromHash() {
  const m = /room-(\d{4})/.exec(location.hash || '');
  return m ? normalizeRoom(m[1]) : null;
}

function setHash(room) {
  try { history.replaceState(null, '', `#room-${room}`); } catch (e) { /* 무시 */ }
}

function start(room) {
  state = newGame(room);
  selected = null;
  viewing = null;
  caption = null;
  setHash(room);
  showScreen('game');
  render();
  window.scrollTo(0, 0);
}

function showScreen(name) {
  ['title', 'game', 'result'].forEach((id) => { $(id).hidden = id !== name; });
}

// ---------- 렌더링 ----------
function phaseName() {
  const p = PERIODS[state.period];
  switch (state.phase) {
    case 'precheck': return '입실 점검';
    case 'exam': return `${p.label} ${p.subject}`;
    case 'ending': case 'bell': case 'break': return `${p.label} 종료`;
    case 'report': return '감독 보고서';
    default: return '';
  }
}

function budgetText() {
  switch (state.phase) {
    case 'precheck': return `남은 ${PRECHECK.minutes - state.minutes}분`;
    case 'exam': return state.period > 0 ? `확인 ${state.idLeft} · 보기 ${state.patrolLeft}` : `보기 ${state.patrolLeft}`;
    case 'break': return '쉬는 시간';
    default: return '';
  }
}

function render() {
  if (!state) return;
  if (state.phase === 'result') { renderResult(); return; }
  $('hud-time').textContent = clockText(state);
  $('hud-phase').textContent = phaseName();
  $('hud-budget').textContent = budgetText();
  const comp = $('hud-complaints');
  comp.textContent = `민원 ${state.complaints}`;
  comp.className = state.complaints >= 3 ? 'warn' : '';
  renderSeats();
  renderViewer();
  renderActions();
  renderAlbum();
  renderTicker();
  drawNow();
}

function renderSeats() {
  const grid = $('seat-grid');
  grid.innerHTML = '';
  state.students.forEach((s) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s.seat;
    b.setAttribute('aria-pressed', String(selected === s.seat));
    b.setAttribute('aria-label', `${label(s)}${s.flagged ? ', 의심 표시됨' : ''}`);
    if (s.flagged) b.classList.add('flagged');
    if (s.slipState === 'reported' || s.schemeState === 'caught') b.classList.add('out');
    b.addEventListener('click', () => select(s.seat));
    grid.appendChild(b);
  });
}

function renderViewer() {
  const s = selected ? student(state, selected) : null;
  const entry = viewing != null ? state.log[viewing] : null;
  $('v-title').textContent = s ? label(s) : '수험생을 고르세요';
  $('v-time').textContent = entry ? `${entry.time} · ${entry.text}` : s ? '아직 가까이 보지 않았다' : '';
  // 도트가 고르게 보이도록 정수 배율로 키운다.
  const cv = $('closeup');
  const avail = cv.parentElement.clientWidth - 24;
  if (avail > 0) cv.style.width = `${CLOSE_W * Math.max(1, Math.floor(avail / CLOSE_W))}px`;
  closeCtx.fillStyle = '#000';
  closeCtx.fillRect(0, 0, CLOSE_W, CLOSE_H);
  if (entry && entry.view) drawCloseup(closeCtx, entry.view);
  else drawPlaceholder();
  const cap = $('v-caption');
  cap.textContent = caption ? caption.text : '';
  cap.className = `v-caption${caption ? ` k-${caption.kind}` : ''}`;
}

function drawPlaceholder() {
  closeCtx.fillStyle = '#0d1015';
  closeCtx.fillRect(0, 0, CLOSE_W, CLOSE_H);
  closeCtx.fillStyle = '#2c333e';
  closeCtx.fillRect(60, 18, 40, 44);
  closeCtx.fillRect(42, 64, 76, 34);
  closeCtx.fillRect(0, 96, CLOSE_W, 24);
}

function btn(box, text, sub, onClick, opts = {}) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'act' + (opts.cls ? ` ${opts.cls}` : '');
  b.innerHTML = `<span>${esc(text)}</span>${sub ? `<small>${esc(sub)}</small>` : ''}`;
  b.disabled = !!opts.disabled;
  if (opts.pressed != null) b.setAttribute('aria-pressed', String(opts.pressed));
  b.addEventListener('click', onClick);
  box.appendChild(b);
}

function renderActions() {
  const box = $('actions');
  box.innerHTML = '';
  if (state.pending) {
    btn(box, '부정행위로 처리', '답안지 회수', () => act(() => resolvePending(state, 'report')), { cls: 'danger' });
    btn(box, '봐주기', '주의만 준다', () => act(() => resolvePending(state, 'excuse')));
    return;
  }
  const s = selected ? student(state, selected) : null;
  const flag = () => {
    if (s) btn(box, s.flagged ? '의심 지우기' : '의심 표시', '무료', () => { toggleFlag(state, s.seat); render(); }, { cls: 'flag', pressed: s.flagged });
  };
  const cost = (k) => (s && s.checked[k] ? '완료' : `${PRECHECK.cost[k]}분`);

  if (state.phase === 'precheck') {
    if (s) {
      btn(box, '사진 대조', cost('id'), () => act(() => precheck(state, 'id', s.seat)), { disabled: !canPrecheck(state, 'id', s.seat) });
      btn(box, '소매·단추', cost('clothes'), () => act(() => precheck(state, 'clothes', s.seat)), { disabled: !canPrecheck(state, 'clothes', s.seat) });
      if (s.look.glasses) btn(box, '안경 벗겨 보기', cost('glasses'), () => act(() => precheck(state, 'glasses', s.seat)), { disabled: !canPrecheck(state, 'glasses', s.seat) });
      btn(box, '소지품 보기', cost('pockets'), () => act(() => precheck(state, 'pockets', s.seat)), { disabled: !canPrecheck(state, 'pockets', s.seat) });
      flag();
    }
    btn(box, '전자기기 안내', state.announced ? '완료' : '1분 · 교실 전체', () => act(() => precheck(state, 'announce')), { disabled: !canPrecheck(state, 'announce') });
    btn(box, '1교시 시작', '', () => act(() => finishPrecheck(state)), { cls: 'main' });
  } else if (state.phase === 'exam') {
    if (s) {
      btn(box, '가까이 보기', `${state.patrolLeft}회 남음`, () => act(() => patrol(state, s.seat)), { disabled: !canPatrol(state, s.seat) });
      if (state.period > 0) btn(box, '본인 확인', `${state.idLeft}회 · 사진${state.period <= 2 ? '·소매' : ''}${state.period === 2 ? '·소지품' : ''}`, () => act(() => idCheck(state, s.seat)), { disabled: !canIdCheck(state, s.seat) });
      flag();
    }
    btn(box, `${PERIODS[state.period].label} 끝내기`, '', () => act(() => endExam(state)), { cls: 'main' });
  } else if (state.phase === 'break') {
    suspects(state).forEach((x) => {
      btn(box, `${x.seat}번 정밀 점검`, '금속탐지기 · 쉬는 시간 1명', () => { selected = x.seat; act(() => afterCheck(state, x.seat)); }, { disabled: !canAfterCheck(state, x.seat) });
    });
    const last = state.period === PERIODS.length - 1;
    btn(box, last ? '보고서로' : `${PERIODS[state.period + 1].label}로`, '', () => act(() => nextPeriod(state)), { cls: 'main' });
  } else if (state.phase === 'report') {
    flag();
    btn(box, '보고서 제출', `사후 조사: ${suspects(state).map((x) => `${x.seat}번`).join(', ') || '없음'}`, () => act(() => submitReport(state)), { cls: 'main' });
  }
}

function renderAlbum() {
  const box = $('album-box');
  const shots = selected ? snapshots(state, selected) : [];
  box.hidden = !shots.length;
  const album = $('album');
  album.innerHTML = '';
  shots.forEach((e) => {
    const idx = state.log.indexOf(e);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'shot';
    b.setAttribute('aria-current', String(idx === viewing));
    b.setAttribute('aria-label', `${e.time} ${e.text}`);
    const c = document.createElement('canvas');
    c.width = CLOSE_W;
    c.height = CLOSE_H;
    drawCloseup(c.getContext('2d'), e.view);
    const t = document.createElement('span');
    t.textContent = e.time;
    b.append(c, t);
    b.addEventListener('click', () => { viewing = idx; caption = null; render(); });
    album.appendChild(b);
  });
}

// 이번 교시에 앞에서 보인 것 (짧은 글)
function renderTicker() {
  let from = 0;
  state.log.forEach((e, i) => { if (e.kind === 'period') from = i; });
  const items = state.log.slice(from).filter((e) => !e.view && e.kind !== 'decision');
  $('ticker').innerHTML = items.map((e) => `<li><span class="t">${e.time}</span><span class="k-${e.kind}">${esc(e.text)}</span></li>`).join('');
}

function renderResult() {
  showScreen('result');
  const r = state.result;
  $('r-room').textContent = state.room;
  $('r-grade').textContent = r.grade;
  $('r-title').textContent = r.title;
  $('r-stats').textContent = `점수 ${r.score} · 민원 ${r.complaints}`;
  const list = $('r-truth');
  list.innerHTML = '';
  state.students.forEach((s) => {
    const t = truth(s);
    if (!s.scheme && !s.slip && !s.flagged) return;
    const cls = s.scheme ? 'scheme' : s.slip ? 'slip' : 'clean';
    const out = outcome(s);
    const li = document.createElement('li');
    li.innerHTML = `<span class="no">${s.seat}번</span><div><span class="tag ${cls}">${t.tag}${t.name ? ` · ${esc(t.name)}` : ''}</span>${esc(s.name)}${out ? `<span class="out">${esc(out)}</span>` : ''}<p>${esc(t.text)}</p></div>`;
    const shots = snapshots(state, s.seat);
    if (shots.length) {
      const c = document.createElement('canvas');
      c.width = CLOSE_W;
      c.height = CLOSE_H;
      drawCloseup(c.getContext('2d'), shots[shots.length - 1].view);
      li.lastChild.appendChild(c);
    }
    list.appendChild(li);
  });
  drawScene($('result-scene').getContext('2d'), state, { t: 0, reduceMotion: true });
  window.scrollTo(0, 0);
}

function esc(str) {
  return String(str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ---------- 입력 ----------
function select(seat) {
  selected = seat;
  const shots = snapshots(state, seat);
  viewing = shots.length ? state.log.indexOf(shots[shots.length - 1]) : null;
  caption = null;
  render();
}

// 행동 실행 후, 새로 생긴 기록 중 그림이 있으면 확대 창에 띄우고 결과 글은 한 줄로 보여 준다.
function act(fn) {
  const from = state.log.length;
  fn();
  const fresh = state.log.slice(from);
  const shot = fresh.map((e, i) => ({ e, i: from + i })).filter((x) => x.e.view).pop();
  if (shot) { viewing = shot.i; selected = shot.e.seat; }
  else if (selected) {
    const shots = snapshots(state, selected);
    viewing = shots.length ? state.log.indexOf(shots[shots.length - 1]) : null;
  }
  const important = fresh.filter((e) => ['found', 'caught', 'clean', 'prevent', 'decision'].includes(e.kind)).pop();
  caption = important ? { text: important.text, kind: important.kind } : null;
  if (state.pending) caption = { text: state.pending.text, kind: 'found' };
  render();
}

$('scene').addEventListener('click', (ev) => {
  if (!state) return;
  const rect = ev.currentTarget.getBoundingClientRect();
  const seat = seatAt(((ev.clientX - rect.left) / rect.width) * SCENE_W, ((ev.clientY - rect.top) / rect.height) * SCENE_H);
  if (seat) select(seat);
});

$('start-btn').addEventListener('click', () => start(normalizeRoom($('room-input').value) || randomRoom()));
$('room-input').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') $('start-btn').click(); });
$('how-btn').addEventListener('click', (ev) => {
  const how = $('how');
  how.hidden = !how.hidden;
  ev.currentTarget.setAttribute('aria-expanded', String(!how.hidden));
});
$('btn-retry').addEventListener('click', () => start(state.room));
$('btn-new').addEventListener('click', () => start(randomRoom()));
$('btn-copy').addEventListener('click', async (ev) => {
  const b = ev.currentTarget;
  try { await navigator.clipboard.writeText(String(state.room)); b.textContent = `복사됨 · ${state.room}`; }
  catch (e) { b.textContent = `시험실 번호 ${state.room}`; }
});
$('btn-card').addEventListener('click', async () => {
  try { await document.fonts.load('20px "Galmuri11"'); await document.fonts.load('700 20px "Galmuri11"'); } catch (e) { /* 기본 글꼴 */ }
  const canvas = renderCard(state);
  $('card-img').src = canvas.toDataURL('image/png');
  cardBlob = null;
  canvas.toBlob((b) => { cardBlob = b; });
  $('card-overlay').hidden = false;
});
$('btn-close-card').addEventListener('click', () => { $('card-overlay').hidden = true; });
$('btn-share').addEventListener('click', async (ev) => {
  const b = ev.currentTarget;
  const text = `수능 감독관 ${state.result.grade}등급 · ${state.result.title}. 시험실 ${state.room}에서 붙어 보자.`;
  try {
    const file = cardBlob ? new File([cardBlob], `suneung-${state.room}.png`, { type: 'image/png' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
    if (navigator.share) { await navigator.share({ text }); return; }
    throw new Error('no share');
  } catch (e) {
    b.textContent = '이미지를 길게 눌러 저장하세요';
  }
});

// ---------- 그리기 ----------
let lastDraw = 0;
function drawNow(t = performance.now()) {
  if (state && state.phase !== 'result') drawScene(sceneCtx, state, { t, selected, reduceMotion });
}
function frame(t) {
  if (state && !$('game').hidden && t - lastDraw > 90) { lastDraw = t; drawNow(t); }
  requestAnimationFrame(frame);
}

// ---------- 부팅 ----------
function boot(data) {
  if (data && data.state && data.state.v === 3) {
    state = data.state;
    selected = data.selected || null;
    viewing = data.viewing != null ? data.viewing : null;
    showScreen(state.phase === 'result' ? 'result' : 'game');
    render();
  } else {
    showScreen('title');
    const r = roomFromHash();
    if (r) $('room-input').value = String(r);
  }
  requestAnimationFrame(frame);
}

const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ state, selected, viewing }));
if (hot && hot.ready) hot.ready(boot);
else boot(hot && hot.data ? hot.data : {});

return {  };
})();
})();
</script>
