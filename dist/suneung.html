:root {
  --page: #1b1f27;
  --box: #0d1015;
  --line: #f2efe6;
  --text: #f4f1e8;
  --dim: #a9b1bb;
  --yellow: #ffd84a;
  --red: #ff6b6b;
  --orange: #ffa94d;
  --green: #69db7c;
  --font: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  color-scheme: dark;
}

html, body { height: auto; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.75;
  word-break: keep-all;
  overflow-wrap: anywhere;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
  -webkit-font-smoothing: none;
}

[hidden] { display: none !important; }

.app { max-width: 520px; margin: 0 auto; }
.screen { display: flex; flex-direction: column; gap: 14px; }

.box {
  background: var(--box);
  border: 3px solid var(--line);
  box-shadow: 0 0 0 3px var(--box);
  padding: 14px 16px;
  margin: 3px;
}
.dim { color: var(--dim); }
b { color: var(--yellow); font-weight: 700; }

/* 시작 화면 */
.intro { display: flex; flex-direction: column; gap: 10px; }
.intro p { margin: 0; }
.intro h1 {
  margin: 4px 0;
  font-size: 44px;
  line-height: 1.2;
  font-weight: 700;
  color: var(--yellow);
  text-shadow: 3px 3px 0 #6b4f00;
}
.field { display: block; margin-bottom: 6px; }
input {
  font: inherit;

/* 장면 */
#scene, #result-scene {
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 240 / 204;
  image-rendering: pixelated;
  border: 3px solid var(--line);
  box-shadow: 0 0 0 3px var(--box);
  margin: 3px;
  width: calc(100% - 6px);
  box-sizing: border-box;
  touch-action: manipulation;
  cursor: pointer;
}
#result-scene { cursor: default; }

/* 좌석 버튼 */
.seat-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.seat-grid button {
  font: inherit;
  font-size: 17px;
  min-height: 44px;

// ---- src/game.js
// 게임 규칙. 화면과 분리된 순수 로직. 상태는 평범한 JSON 객체다.
// 관찰 결과는 글이 아니라 "그림 상태(view)"로 남긴다. pixel.js가 그것을 확대 그림으로 그린다.

// ---------- 난수 ----------
function makeRng(seed) {
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    chance: (p) => next() < p,
    shuffle: (arr) => {
      const out = arr.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    },
  };
}

function normalizeRoom(value) {
  const n = parseInt(String(value).replace(/\D/g, ''), 10);
  if (!Number.isFinite(n) || n < 1000 || n > 9999) return null;
  return n;
}

function randomRoom() {
  return 1000 + Math.floor(Math.random() * 9000);
}

function rngFor(state, salt) {
  return makeRng((Math.imul(state.room, 2654435761) + state.actionIndex * 7919 + salt) >>> 0);
}

function fill(text, n) {
  return text.split('{n}').join(String(n));
}

// ---------- 시각 ----------
function formatTime([h, m]) {
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function addMin([h, m], d) {
  const t = h * 60 + m + d;
  return [Math.floor(t / 60), t % 60];
}

function clock(state) {
  const p = PERIODS[state.period];
  switch (state.phase) {
    case 'precheck': return addMin(PRECHECK.start, state.minutes);
    case 'exam': return addMin(p.start, (BUDGET.patrol - state.patrolLeft) * 20 + (BUDGET.idCheck - state.idLeft) * 2 + 5);
    case 'ending':
    case 'bell':
    case 'break': return p.end;
    default: return PERIODS[3].end;
  }
}

function clockText(state) {
  return formatTime(clock(state));
}

// ---------- 생성 ----------
function student(state, seat) {
  return state.students[seat - 1];
}

function label(s) {
  return `${s.seat}번 ${s.name}`;
}

function newGame(room) {
  const rng = makeRng(Math.imul(room, 7919) + 101);
  const given = rng.shuffle(GIVEN_NAMES);
  const students = SEATS.map((seat, i) => ({
    seat,
    name: rng.pick(SURNAMES) + given[i],
    look: {
      skin: rng.pick(LOOKS.skin),
      hair: rng.pick(LOOKS.hair),
      hairStyle: rng.pick(LOOKS.hairStyle),
      glasses: rng.chance(0.4),
      clothes: rng.pick(LOOKS.clothes),
    },
    mole: rng.chance(0.3),
    watch: rng.chance(0.35) ? 'analog' : null,
    slip: null,
    scheme: null,
    habit: null,
    checked: { id: false, clothes: false, glasses: false, pockets: false },
    sticker: false,
    slipState: null, // prevented | reported | excused
    schemeState: null, // caught | flagged
    flagged: false,
    mood: 'normal',
  }));

  // 계획형: 매 판 1명, 45% 확률로 2명. 실수형: 60% 확률로 1명.
  const order = rng.shuffle(SEATS);
  let cursor = 0;
  rng.shuffle(Object.keys(SCHEMES)).slice(0, rng.chance(0.45) ? 2 : 1).forEach((key) => {
    const s = students[order[cursor++] - 1];
    const sc = SCHEMES[key];
    s.scheme = key;
    if (sc.needsGlasses) s.look.glasses = true;
    if (sc.clothes) s.look.clothes = LOOKS.clothes.find((c) => c.kind === sc.clothes);
    if (sc.watch) s.watch = sc.watch;
    if (key === 'proxy') s.mole = false; // 사진에는 점이 있고 얼굴에는 없다
  });
  if (rng.chance(0.6)) {
    const s = students[order[cursor++] - 1];
    s.slip = rng.pick(Object.keys(SLIPS));
    if (s.slip === 'watch') s.watch = 'digital';
  }
  students.filter((s) => !s.scheme && !s.slip).forEach((s) => {
    if (!rng.chance(0.7)) return;
    const options = Object.keys(HABITS).filter((k) => !HABITS[k].needsGlasses || s.look.glasses);
    s.habit = rng.pick(options);
    if (HABITS[s.habit].watch) s.watch = HABITS[s.habit].watch;
  });

  // 교시별로 앞에서 보이는 장면
  const schedule = PERIODS.map(() => []);
  const bellAt = rng.int(0, 3);
  students.forEach((s) => {
    if (s.habit) {
      const h = HABITS[s.habit];
      let periods;
      if (h.period != null) periods = [h.period];
      else if (h.falls) periods = [rng.int(0, 3)];
      else periods = rng.shuffle([0, 1, 2, 3]).slice(0, rng.int(1, 2));
      periods.forEach((p) => schedule[p].push({ kind: h.falls ? 'sticker' : 'habit', seat: s.seat, text: fill(h.line, s.seat) }));
    }
    if (s.scheme) {
      const t = SCHEMES[s.scheme].tells;
      rng.shuffle(t.periods).slice(0, rng.int(t.count[0], t.count[1])).forEach((p) => {
        schedule[p].push({ kind: t.sticker ? 'sticker' : 'tell', seat: s.seat, text: fill(rng.pick(t.lines), s.seat) });
      });
      if (t.extra) schedule[t.extra.period].push({ kind: 'tell', seat: s.seat, text: fill(t.extra.text, s.seat) });
    }
  });
  PERIODS.forEach((_, p) => {
    if (rng.chance(0.5)) {
      const options = AMBIENT.filter((a) => a.period == null || a.period === p);
      schedule[p].push({ kind: 'ambient', seat: null, text: rng.pick(options).text });
    }
  });

  const state = {
    v: 3,
    room,
    phase: 'precheck',
    period: 0,
    minutes: 0,
    announced: false,
    alertDone: false,
    idLeft: 0,
    patrolLeft: BUDGET.patrol,
    afterLeft: BUDGET.afterCheck,
    complaints: 0,
    actionIndex: 0,
    students,
    schedule: schedule.map((list) => rng.shuffle(list)),
    bellAt,
    pending: null,
    log: [],
    result: null,
  };
  log(state, 'system', '08:10 입실 마감. 08:40까지 30분 동안 점검한다.');
  return state;
}

// ---------- 공통 ----------
function log(state, kind, text, seat = null, view = null) {
  const entry = { time: clockText(state), kind, text, seat };
  if (view) entry.view = view;
  state.log.push(entry);
  return entry;
}

function busy(state) {
  return state.pending != null || state.phase === 'result';
}

function schemeActive(s, period, phase) {
  if (!s.scheme || phase === 'precheck') return false;
  if (s.scheme === 'aiGlasses') return period > SCHEMES.aiGlasses.swapAfter;
  return true;
}

function eventNow(state, s) {
  if (state.phase !== 'exam') return null;
  return state.schedule[state.period].find((e) => e.seat === s.seat && e.kind !== 'ambient') || null;
}

// 지금 이 수험생을 가까이 봤을 때의 그림 상태
// mode: { id: 수험표 사진, sleeves: 소매 걷음, glassesOff: 안경 벗김, pockets: 소지품 꺼냄 }
function makeView(state, s, rng, mode = {}) {
  const active = schemeActive(s, state.period, state.phase);
  const sc = s.scheme ? SCHEMES[s.scheme] : null;
  const h = s.habit ? HABITS[s.habit] : null;
  const ev = eventNow(state, s);
  const slip = s.slip && !s.slipState ? SLIPS[s.slip] : null;
  const [ch, cm] = clock(state);

  let pose = 'desk';
  if (ev && rng.chance(0.75)) pose = (sc && sc.pose) || (h && h.pose) || 'desk';
  else if (active && sc.pose !== 'none' && rng.chance(0.35)) pose = sc.pose;
  if (pose === 'none') pose = 'desk';

  let watch = null;
  if (s.watch === 'digital') watch = { type: 'digital' };
  else if (s.watch === 'analog' || s.watch === 'hybrid') {
    let wh = ch;
    let wm = cm;
    if (s.watch === 'hybrid' && active && rng.chance(0.65)) {
      wh = rng.int(1, 12);
      wm = rng.pick([0, 15, 30, 45]);
    }
    watch = { type: 'analog', h: wh, m: wm };
  }

  let sticker = s.sticker ? 'on' : 'none';
  if (s.sticker && ((ev && ev.kind === 'sticker') || (s.scheme === 'buttonCam' && active && rng.chance(0.4)))) sticker = 'missing';
  if (sticker === 'on' && h && h.peeled) sticker = 'peeled';

  const usingAnswers = active && sc.blank > 0 && rng.chance(sc.blank);
  const progress = state.phase === 'precheck' ? 0 : Math.min(1, (BUDGET.patrol - state.patrolLeft + 1) / (BUDGET.patrol + 1));

  return {
    seat: s.seat,
    time: [ch, cm],
    look: s.look,
    mood: s.mood,
    pose,
    faceMole: s.mole,
    glasses: s.look.glasses
      ? { thick: s.scheme === 'aiGlasses' && active, glint: s.scheme === 'aiGlasses' && active && rng.chance(0.6), off: !!mode.glassesOff }
      : null,
    sticker,
    bigButton: s.scheme === 'buttonCam',
    sleeves: !!mode.sleeves,
    watch,
    earBlob: s.scheme === 'earpiece' && active && rng.chance(0.55),
    waist: s.scheme === 'vibration' && (active || !!mode.sleeves) && rng.chance(0.6),
    buzz: s.scheme === 'vibration' && active && rng.chance(0.4),
    pocketBulge: slip && slip.pocket ? (s.slip === 'earbuds' ? 'small' : 'phone') : null,
    fakePen: s.scheme === 'penCam' && state.phase !== 'precheck',
    paper: state.phase === 'precheck' ? 'none' : usingAnswers || (h && h.blank) ? 'blank' : 'scribbled',
    omr: progress,
    idPhoto: mode.id ? { mole: s.scheme === 'proxy' ? true : s.mole } : null,
    pockets: mode.pockets ? (slip && slip.pocket ? [s.slip === 'earbuds' ? 'earbuds' : 'phone'] : []) : null,
  };
}

function askSlip(state, s, text, view = null) {
  const rng = rngFor(state, 9);
  state.pending = { seat: s.seat, text, reaction: rng.pick(SLIPS[s.slip].reaction) };
  s.mood = 'nervous';
  log(state, 'found', text, s.seat, view);
}

function resolvePending(state, choice) {
  const p = state.pending;
  if (!p) return;
  const s = student(state, p.seat);
  if (choice === 'report') {
    s.slipState = 'reported';
    s.mood = 'crying';
    log(state, 'decision', `부정행위로 처리했다. "${p.reaction}"`, s.seat);
  } else {
    s.slipState = 'excused';
    s.mood = 'normal';
    log(state, 'decision', `주의만 주고 넘어갔다. "${p.reaction}"`, s.seat);
  }
  if (s.slip === 'watch') s.watch = null;
  state.pending = null;
  state.actionIndex += 1;
  continueAfterPending(state);
}

function toggleFlag(state, seat) {
  if (state.phase === 'result') return;
  const s = student(state, seat);
  s.flagged = !s.flagged;
}

// ---------- 입실 점검 (08:10~08:40) ----------
function canPrecheck(state, kind, seat) {
  if (state.phase !== 'precheck' || busy(state)) return false;
  if (state.minutes + PRECHECK.cost[kind] > PRECHECK.minutes) return false;
  if (kind === 'announce') return !state.announced;
  const s = student(state, seat);
  if (!s) return false;
  if (kind === 'glasses' && !s.look.glasses) return false;
  return !s.checked[kind];
}

const PRECHECK_CAPTION = { id: '사진 대조', clothes: '소매 걷기 · 단추 스티커', glasses: '안경 벗겨 보기', pockets: '소지품 꺼내 보기' };

function precheck(state, kind, seat) {
  if (!canPrecheck(state, kind, seat)) return false;
  const rng = rngFor(state, 1);
  state.minutes += PRECHECK.cost[kind];
  state.actionIndex += 1;

  if (kind === 'announce') {
    state.announced = true;
    log(state, 'action', '"전자기기는 지금 내면 문제없습니다." 다시 안내했다.');
    state.students.forEach((s) => {
      if (s.slip && (SLIPS[s.slip].pocket || SLIPS[s.slip].sleeve) && !s.slipState && rng.chance(0.5)) {
        s.slipState = 'prevented';
        if (s.slip === 'watch') s.watch = null;
        log(state, 'prevent', `${s.seat}번이 머뭇거리다 전자기기를 냈다.`, s.seat);
      }
    });
  } else {
    const s = student(state, seat);
    s.checked[kind] = true;
    if (kind === 'clothes') s.sticker = true;
    const view = makeView(state, s, rng, { id: kind === 'id', sleeves: kind === 'clothes', glassesOff: kind === 'glasses', pockets: kind === 'pockets' });
    log(state, 'view', PRECHECK_CAPTION[kind], seat, view);
    const slip = s.slip && !s.slipState ? SLIPS[s.slip] : null;
    if (slip && ((kind === 'clothes' && slip.sleeve) || (kind === 'pockets' && slip.pocket))) {
      s.slipState = 'prevented';
      if (s.slip === 'watch') s.watch = null;
      log(state, 'prevent', `${slip.find} 시험 전이라 제출받았다.`, seat);
    }
  }
  maybeAlert(state);
  return true;
}

function maybeAlert(state) {
  if (state.alertDone || state.minutes < PRECHECK.alertAt) return;
  state.alertDone = true;
  const saved = state.minutes;
  state.minutes = PRECHECK.alertAt;
  log(state, 'alert', '08:25 위급재난문자 발송');
  const ringers = state.students.filter((s) => s.slip && SLIPS[s.slip].ring && !s.slipState);
  if (ringers.length) {
    ringers.forEach((s) => {
      s.slipState = 'prevented';
      s.mood = 'nervous';
      log(state, 'prevent', `${s.seat}번 외투에서 알림음! 휴대폰을 제출받았다.`, s.seat);
    });
  } else {
    log(state, 'system', '교실은 조용하다.');
  }
  state.minutes = saved;
}

function finishPrecheck(state) {
  if (state.phase !== 'precheck' || busy(state)) return;
  state.minutes = PRECHECK.minutes;
  maybeAlert(state);
  const rest = state.students.filter((s) => !s.checked.clothes);
  rest.forEach((s) => { s.sticker = true; });
  if (rest.length) log(state, 'system', `부감독관이 나머지 ${rest.length}명에게 스티커만 붙였다.`);
  state.actionIndex += 1;
  startExam(state);
}

// ---------- 교시 ----------
function startExam(state) {
  const p = PERIODS[state.period];
  state.phase = 'exam';
  state.patrolLeft = BUDGET.patrol;
  state.idLeft = state.period > 0 ? BUDGET.idCheck : 0;
  log(state, 'period', `${p.label} ${p.subject}${state.period === 2 ? ' · 소지품 재점검' : ''}`);
  state.schedule[state.period].forEach((ev) => log(state, ev.kind === 'ambient' ? 'ambient' : 'event', ev.text, ev.seat));
}

function canIdCheck(state, seat) {
  return state.phase === 'exam' && !busy(state) && state.idLeft > 0 && !!student(state, seat);
}

function idCheck(state, seat) {
  if (!canIdCheck(state, seat)) return false;
  const s = student(state, seat);
  const rng = rngFor(state, 2);
  const p = state.period;
  state.idLeft -= 1;
  state.actionIndex += 1;
  const view = makeView(state, s, rng, { id: true, sleeves: p <= 2, pockets: p === 2 });
  const slip = s.slip && !s.slipState ? SLIPS[s.slip] : null;
  if (slip && ((slip.sleeve && p <= 2) || (slip.pocket && p === 2))) {
    askSlip(state, s, `본인 확인 중 발견: ${slip.find}`, view);
    return true;
  }
  log(state, 'view', `본인 확인${p <= 2 ? ' · 소매' : ''}${p === 2 ? ' · 소지품' : ''}`, seat, view);
  return true;
}

function canPatrol(state, seat) {
  return state.phase === 'exam' && !busy(state) && state.patrolLeft > 0 && !!student(state, seat);
}

function patrol(state, seat) {
  if (!canPatrol(state, seat)) return false;
  const s = student(state, seat);
  const rng = rngFor(state, 3);
  state.patrolLeft -= 1;
  state.actionIndex += 1;
  const view = makeView(state, s, rng);
  if (s.slip === 'watch' && !s.slipState) {
    askSlip(state, s, '손목에 숫자 화면이 있는 전자시계.', view);
    return true;
  }
  log(state, 'view', '가까이 봄', seat, view);
  return true;
}

function endExam(state) {
  if (state.phase !== 'exam' || busy(state)) return;
  state.actionIndex += 1;
  state.patrolLeft = 0;
  state.idLeft = 0;
  const s4 = state.students.find((s) => s.slip === 'section4' && !s.slipState);
  if (state.period === 3 && s4) {
    state.phase = 'ending';
    askSlip(state, s4, fill(SLIPS.section4.event, s4.seat));
    return;
  }
  ringBell(state);
}

function ringBell(state) {
  const bell = state.students.find((s) => s.slip === 'bell' && !s.slipState);
  if (bell && state.bellAt === state.period) {
    state.phase = 'bell';
    askSlip(state, bell, fill(SLIPS.bell.event, bell.seat));
    return;
  }
  toBreak(state);
}

function continueAfterPending(state) {
  if (state.pending) return;
  if (state.phase === 'ending') ringBell(state);
  else if (state.phase === 'bell') toBreak(state);
}

function suspects(state) {
  return state.students.filter((s) => s.flagged && s.schemeState !== 'caught' && s.slipState !== 'reported');
}

function toBreak(state) {
  const p = PERIODS[state.period];
  state.afterLeft = BUDGET.afterCheck;
  state.phase = 'break';
  log(state, 'system', `${p.label} 종료${state.period === 1 ? ' · 점심시간' : ''}`);
  state.students.forEach((s) => { if (s.mood === 'nervous') s.mood = 'normal'; });
  // 의심 표시한 수험생이 있을 때만 쉬는 시간 점검 단계를 연다.
  if (!suspects(state).length) advance(state);
}

function canAfterCheck(state, seat) {
  return state.phase === 'break' && !busy(state) && state.afterLeft > 0 && !!student(state, seat);
}

// 쉬는 시간 정밀 점검: 시험본부 금속탐지기
function afterCheck(state, seat) {
  if (!canAfterCheck(state, seat)) return false;
  const s = student(state, seat);
  const rng = rngFor(state, 4);
  state.afterLeft -= 1;
  state.actionIndex += 1;

  if (s.scheme && schemeActive(s, state.period, state.phase) && rng.chance(SCHEMES[s.scheme].detect)) {
    s.schemeState = 'caught';
    s.mood = 'shocked';
    log(state, 'caught', `${SCHEMES[s.scheme].found} ${SCHEMES[s.scheme].caught}`, seat);
    return true;
  }
  const slip = s.slip && !s.slipState ? SLIPS[s.slip] : null;
  if (slip && (slip.pocket || slip.sleeve)) {
    askSlip(state, s, slip.find);
    return true;
  }
  state.complaints += 1;
  if (s.scheme) {
    const sc = SCHEMES[s.scheme];
    s.mood = 'calm';
    const miss = schemeActive(s, state.period, state.phase) && sc.missText ? sc.missText : '아무것도 나오지 않았다.';
    log(state, 'clean', `${miss} "${rng.pick(sc.calm)}" 민원 1건.`, seat);
  } else {
    s.mood = 'angry';
    log(state, 'clean', `아무것도 나오지 않았다. "${rng.pick(PROTEST)}" 민원 1건.`, seat);
  }
  return true;
}

function nextPeriod(state) {
  if (state.phase !== 'break' || busy(state)) return;
  advance(state);
}

function advance(state) {
  state.actionIndex += 1;
  if (state.period < PERIODS.length - 1) {
    state.period += 1;
    startExam(state);
  } else if (suspects(state).length) {
    state.phase = 'report';
    log(state, 'system', '시험 끝. 의심 표시한 수험생은 사후 조사를 요청할 수 있다.');
  } else {
    state.phase = 'report';
    submitReport(state);
  }
}

// ---------- 채점 ----------
function submitReport(state) {
  if (state.phase !== 'report') return null;
  let score = 100;
  const tally = { prevented: 0, reported: 0, excused: 0, missedSlip: 0, falseFlags: 0 };
  const schemes = [];
  state.students.forEach((s) => {
    if (s.slip) {
      if (s.slipState === 'prevented') tally.prevented += 1;
      else if (s.slipState === 'reported') tally.reported += 1;
      else if (s.slipState === 'excused') { tally.excused += 1; score -= 15; }
      else { tally.missedSlip += 1; score -= 10; }
    }
    if (s.scheme) {
      if (s.schemeState !== 'caught' && s.flagged) s.schemeState = 'flagged';
      schemes.push({ seat: s.seat, key: s.scheme, state: s.schemeState || 'missed' });
      if (s.schemeState === 'flagged') score -= 15;
      if (!s.schemeState) score -= 35;
    } else if (s.flagged && !s.slip) {
      tally.falseFlags += 1;
      score -= 10;
    }
  });
  score -= state.complaints * 5;
  score = Math.max(0, Math.min(100, score));
  const grade = score >= 90 ? 1 : score >= 80 ? 2 : score >= 70 ? 3 : score >= 60 ? 4 : score >= 50 ? 5 : score >= 40 ? 6 : score >= 30 ? 7 : score >= 20 ? 8 : 9;

  const caught = schemes.filter((x) => x.state === 'caught').length;
  const missed = schemes.filter((x) => x.state === 'missed').length;
  let title;
  if (caught === schemes.length) title = grade <= 2 ? '2년의 준비를 무너뜨린 감독관' : '잡긴 다 잡은 감독관';
  else if (missed === schemes.length) title = '아무 일 없던 시험실… 이었을까?';
  else if (state.complaints + tally.falseFlags >= 4) title = '민원 폭탄 감독관';
  else if (caught > 0) title = '절반만 막은 감독관';
  else title = '촉은 맞았던 감독관';

  state.result = { score, grade, title, schemes, ...tally, complaints: state.complaints };
  state.phase = 'result';
  return state.result;
}

function truth(s) {
  if (s.scheme) return { tag: '계획형', name: SCHEMES[s.scheme].name, text: SCHEMES[s.scheme].reveal };
  if (s.slip) return { tag: '실수형', name: SLIPS[s.slip].name, text: SLIPS[s.slip].reveal };
  return { tag: '무고', name: '', text: s.habit ? '수상해 보인 행동은 그냥 습관이었다.' : '아무 문제 없이 시험을 봤다.' };
}

function outcome(s) {
  if (s.scheme) return { caught: '적발', flagged: '사후 조사로 적발', missed: '놓침' }[s.schemeState || 'missed'];
  if (s.slip) return { prevented: '시험 전 예방', reported: '부정행위 처리', excused: '봐줌' }[s.slipState] || '놓침';
  return s.flagged ? '잘못 의심' : '';
}

// 수험생별 확대 그림 기록(수첩)
function snapshots(state, seat) {
  return state.log.filter((e) => e.seat === seat && e.view);
}

// ---- src/pixel.js
// 도트 시험실: 교탁에서 본 12명 (3줄 x 4칸). 이미지 파일 없이 사각형으로 그린다.


const SCENE_W = 240;
const SCENE_H = 204;
const COLS = [36, 92, 148, 204];
const ROWS = [178, 134, 90]; // 책상 윗면 y: 앞줄(1~4), 가운데(5~8), 뒷줄(9~12)

const C = {
  wall: '#c9cbbd', wallDark: '#b4b7a6', locker: '#7f8f86', lockerLine: '#65746c', handle: '#d9dccf',
  board: '#9b7a52', note: '#efe9d6', noteB: '#cfe0ea', noteC: '#f2d27a',
  floor: '#8c6c4c', floorLine: '#7a5b3e',
  deskTop: '#c79a68', deskFront: '#a27850', deskEdge: '#7d5a37', metal: '#596066',
  paper: '#f6f6f1', omr: '#e0607d', ink: '#1a1d1f', plate: '#eef0ea',
  sticker: '#fff3a6', sweat: '#8fd0ff', tear: '#6fb8ff', blush: '#e98a8a',
  select: '#ffd84a', flag: '#ffd84a', red: '#ff5a5a', orange: '#ff9f43', green: '#5fd38d',
};

const DIGITS = {
  0: ['111', '101', '101', '101', '111'], 1: ['010', '110', '010', '010', '111'],
  2: ['111', '001', '111', '100', '111'], 3: ['111', '001', '111', '001', '111'],
  4: ['101', '101', '111', '001', '001'], 5: ['111', '100', '111', '001', '111'],
  6: ['111', '100', '111', '101', '111'], 7: ['111', '001', '010', '010', '010'],
  8: ['111', '101', '111', '101', '111'], 9: ['111', '101', '111', '001', '111'],
};

function px(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function digits(ctx, str, x, y, color) {
  let cx = x;
  for (const ch of str) {
    const g = DIGITS[ch];
    g.forEach((row, ry) => [...row].forEach((b, rx) => { if (b === '1') px(ctx, cx + rx, y + ry, 1, 1, color); }));
    cx += 4;
  }
}

function seatPos(seat) {
  const row = Math.floor((seat - 1) / 4);
  const col = (seat - 1) % 4;
  return { x: COLS[col], desk: ROWS[row], row };
}

function drawRoom(ctx, state) {
  px(ctx, 0, 0, SCENE_W, 60, C.wall);
  // 게시판과 공지
  px(ctx, 14, 6, 150, 20, C.board);
  [[18, 9, C.note], [34, 8, C.noteB], [52, 10, C.note], [70, 8, C.noteC], [92, 9, C.note], [110, 8, C.noteB], [130, 10, C.note], [146, 8, C.noteC]]
    .forEach(([x, y, c]) => px(ctx, x, y, 12, 14, c));
  // 시계
  const [h, m] = clock(state);
  px(ctx, 196, 4, 24, 24, C.ink);
  px(ctx, 198, 6, 20, 20, C.plate);
  const cx = 208, cy = 16;
  const ha = (((h % 12) + m / 60) / 12) * Math.PI * 2;
  const ma = (m / 60) * Math.PI * 2;
  for (let r = 0; r <= 5; r++) px(ctx, cx + Math.round(Math.sin(ha) * r), cy - Math.round(Math.cos(ha) * r), 1, 1, C.ink);
  for (let r = 0; r <= 8; r++) px(ctx, cx + Math.round(Math.sin(ma) * r), cy - Math.round(Math.cos(ma) * r), 1, 1, C.red);
  // 사물함
  px(ctx, 0, 32, SCENE_W, 28, C.locker);
  for (let x = 0; x < SCENE_W; x += 20) {
    px(ctx, x, 32, 1, 28, C.lockerLine);
    px(ctx, x + 15, 44, 2, 4, C.handle);
  }
  px(ctx, 0, 45, SCENE_W, 1, C.lockerLine);
  // 바닥
  px(ctx, 0, 60, SCENE_W, SCENE_H - 60, C.floor);
  for (let y = 66; y < SCENE_H; y += 9) px(ctx, 0, y, SCENE_W, 1, C.floorLine);
}

function hair(ctx, x, y, look, back) {
  const c = look.hair;
  switch (look.hairStyle) {
    case 'buzz': if (!back) px(ctx, x - 5, y - 1, 10, 2, c); break;
    case 'long':
      if (back) px(ctx, x - 6, y, 12, 14, c);
      else { px(ctx, x - 5, y - 1, 10, 4, c); px(ctx, x - 6, y + 1, 2, 9, c); px(ctx, x + 4, y + 1, 2, 9, c); }
      break;
    case 'ponytail':
      if (back) px(ctx, x + 4, y + 2, 3, 8, c);
      else { px(ctx, x - 5, y - 1, 10, 4, c); px(ctx, x - 6, y + 1, 1, 4, c); px(ctx, x + 5, y + 1, 1, 4, c); }
      break;
    case 'bob':
      if (!back) { px(ctx, x - 6, y - 1, 12, 4, c); px(ctx, x - 6, y + 3, 2, 5, c); px(ctx, x + 4, y + 3, 2, 5, c); }
      break;
    case 'fluffy':
      if (!back) { px(ctx, x - 6, y - 2, 12, 5, c); px(ctx, x - 4, y - 3, 3, 1, c); px(ctx, x + 1, y - 3, 3, 1, c); }
      break;
    default:
      if (!back) { px(ctx, x - 5, y - 1, 10, 4, c); px(ctx, x - 5, y + 3, 1, 2, c); px(ctx, x + 4, y + 3, 1, 2, c); }
  }
}

function face(ctx, x, y, s, blink, thickGlasses) {
  const ey = y + 5;
  const mood = s.mood;
  if (mood === 'shocked') {
    px(ctx, x - 3, ey - 1, 2, 2, C.ink); px(ctx, x + 2, ey - 1, 2, 2, C.ink); px(ctx, x - 1, y + 8, 2, 2, C.ink);
  } else {
    if (blink || mood === 'crying') { px(ctx, x - 3, ey, 2, 1, C.ink); px(ctx, x + 2, ey, 2, 1, C.ink); }
    else { px(ctx, x - 3, ey - 1, 1, 2, C.ink); px(ctx, x + 2, ey - 1, 1, 2, C.ink); }
    if (mood === 'angry') { px(ctx, x - 4, ey - 3, 2, 1, C.ink); px(ctx, x + 3, ey - 3, 2, 1, C.ink); px(ctx, x - 1, y + 9, 3, 1, C.ink); }
    else if (mood === 'calm') { px(ctx, x - 2, y + 8, 1, 1, C.ink); px(ctx, x - 1, y + 9, 3, 1, C.ink); px(ctx, x + 2, y + 8, 1, 1, C.ink); }
    else if (mood === 'nervous') { px(ctx, x - 2, y + 9, 1, 1, C.ink); px(ctx, x - 1, y + 8, 1, 1, C.ink); px(ctx, x, y + 9, 1, 1, C.ink); px(ctx, x + 1, y + 8, 1, 1, C.ink); }
    else px(ctx, x - 1, y + 9, 3, 1, C.ink);
    if (mood === 'crying') { px(ctx, x - 3, ey + 1, 1, 3, C.tear); px(ctx, x + 3, ey + 1, 1, 3, C.tear); }
    if (mood === 'angry') { px(ctx, x - 5, y + 7, 1, 1, C.blush); px(ctx, x + 5, y + 7, 1, 1, C.blush); }
  }
  if (s.look.glasses) {
    const t = thickGlasses ? 2 : 1;
    px(ctx, x - 5, ey - 2, 5, t, C.ink); px(ctx, x + 1, ey - 2, 5, t, C.ink);
    px(ctx, x - 5, ey + 1, 5, 1, C.ink); px(ctx, x + 1, ey + 1, 5, 1, C.ink);
    px(ctx, x - 5, ey - 2, t, 4, C.ink); px(ctx, x + 5 - (t - 1), ey - 2, t, 4, C.ink);
    px(ctx, x, ey - 1, 1, 1, C.ink);
    if (thickGlasses) { px(ctx, x - 7, ey - 1, 2, 2, C.ink); px(ctx, x + 6, ey - 1, 2, 2, C.ink); }
  }
}

function drawStudent(ctx, state, s, o) {
  const { x, desk } = seatPos(s.seat);
  const t = o.t;
  const off = s.seat * 977;
  const blink = (t + off * 3) % 4100 < 140;
  const bob = !o.reduceMotion && (t + off) % 2900 < 160 ? 1 : 0;
  const headY = desk - 23 + bob;
  const cl = s.look.clothes;
  const thick = s.scheme === 'aiGlasses' && state.period > SCHEMES.aiGlasses.swapAfter && !['precheck'].includes(state.phase);

  // 몸
  px(ctx, x - 7, desk - 11, 14, 11, cl.body);
  if (cl.kind === 'uniform') { px(ctx, x - 2, desk - 11, 4, 3, cl.trim); }
  else if (cl.kind === 'hoodie') { px(ctx, x - 4, desk - 11, 8, 2, cl.trim); }
  else if (cl.kind === 'shirt') { px(ctx, x - 1, desk - 11, 2, 1, cl.trim); px(ctx, x, desk - 10, 1, 9, cl.trim); }
  else { px(ctx, x - 7, desk - 7, 14, 1, cl.trim); }
  if (s.sticker) { px(ctx, x - 1, desk - 8, 2, 2, C.sticker); px(ctx, x - 1, desk - 4, 2, 2, C.sticker); }
  // 머리
  hair(ctx, x, headY, s.look, true);
  px(ctx, x - 4, headY, 8, 11, s.look.skin);
  px(ctx, x - 5, headY + 2, 1, 6, s.look.skin);
  px(ctx, x + 4, headY + 2, 1, 6, s.look.skin);
  hair(ctx, x, headY, s.look, false);
  face(ctx, x, headY, s, blink, thick);
  if (s.mood === 'nervous' || s.mood === 'shocked') { px(ctx, x + 6, headY + 1, 1, 1, C.sweat); px(ctx, x + 5, headY + 2, 3, 2, C.sweat); }

  // 책상
  px(ctx, x - 18, desk, 36, 4, C.deskTop);
  px(ctx, x - 10, desk - 1, 12, 2, C.paper);
  px(ctx, x + 4, desk - 1, 7, 2, C.omr);
  px(ctx, x - 9, desk - 1, 3, 2, s.look.skin);
  px(ctx, x + 6, desk - 1, 3, 2, s.look.skin);
  px(ctx, x - 18, desk + 4, 36, 1, C.deskEdge);
  px(ctx, x - 17, desk + 5, 34, 11, C.deskFront);
  px(ctx, x - 16, desk + 16, 2, 8, C.metal);
  px(ctx, x + 14, desk + 16, 2, 8, C.metal);
  const label = String(s.seat);
  const w = label.length * 4 + 3;
  px(ctx, x - Math.floor(w / 2), desk + 6, w, 8, C.plate);
  digits(ctx, label, x - Math.floor(w / 2) + 2, desk + 7, C.ink);

  // 표시
  const top = headY - 9;
  if (o.phase === 'result') {
    const c = s.scheme ? C.red : s.slip ? C.orange : null;
    if (c) { px(ctx, x - 3, top - 1, 7, 7, c); px(ctx, x, top, 1, 3, C.plate); px(ctx, x, top + 4, 1, 1, C.plate); }
  } else {
    if (s.flagged) { px(ctx, x + 7, headY - 2, 5, 7, C.flag); px(ctx, x + 9, headY - 1, 1, 3, C.ink); px(ctx, x + 9, headY + 3, 1, 1, C.ink); }
    if (o.selected === s.seat) {
      const up = o.reduceMotion ? 0 : Math.floor(t / 300) % 2;
      px(ctx, x - 3, top - up, 7, 1, C.select); px(ctx, x - 2, top + 1 - up, 5, 1, C.select);
      px(ctx, x - 1, top + 2 - up, 3, 1, C.select); px(ctx, x, top + 3 - up, 1, 1, C.select);
    }
  }
}

function drawScene(ctx, state, opts = {}) {
  const o = { t: 0, selected: null, reduceMotion: false, ...opts, phase: state.phase };
  ctx.imageSmoothingEnabled = false;
  drawRoom(ctx, state);
  // 뒷줄부터 그려서 앞줄이 위에 오게
  [2, 1, 0].forEach((row) => {
    state.students.filter((s) => Math.floor((s.seat - 1) / 4) === row).forEach((s) => drawStudent(ctx, state, s, o));
  });
}

function seatAt(x, y) {
  for (const row of [0, 1, 2]) {
    for (let col = 0; col < 4; col++) {
      const seat = row * 4 + col + 1;
      const { x: sx, desk } = seatPos(seat);
      if (Math.abs(x - sx) <= 24 && y >= desk - 34 && y <= desk + 16) return seat;
    }
  }
  return null;
}

// ---------- 확대 그림 ----------
// game.js makeView()가 만든 그림 상태를 160x120 도트로 그린다. 단서는 전부 여기에 그림으로만 있다.
const CLOSE_W = 160;
const CLOSE_H = 120;

const Z = {
  wall: '#c9cbbd', locker: '#8a9a90', lockerLine: '#728177',
  desk: '#c79a68', deskEdge: '#9b734b', paper: '#f7f7f2', print: '#cfd2cc', pencil: '#5a5f66',
  omr: '#f3c4cf', omrDot: '#e08aa0', omrFill: '#1a1d1f',
  ink: '#1a1d1f', white: '#ffffff', sticker: '#ffe766', stickerEdge: '#d9b92e',
  button: '#2a2a2e', shine: '#c9d6e8', lens: '#7fe8ff', canal: '#8a5a44',
  pen: '#1c1c1c', penCap: '#5b5f66', penBand: '#ffffff',
  watchBand: '#3b3b40', watchFace: '#f4f1e6', digital: '#0e1a12', digit: '#5dff8a',
  card: '#ffffff', cardHead: '#4a6fa5', mole: '#4a2c1e', tear: '#6fb8ff', sweat: '#8fd0ff', blush: '#e98a8a',
  buzz: '#ffd84a', panel: '#0d1015', panelLine: '#f2efe6',
};

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.max(0, Math.min(255, Math.round(v * f))));
  return `#${c.map((v) => v.toString(16).padStart(2, '0')).join('')}`;
}

function line(ctx, x0, y0, x1, y1, color) {
  const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
  for (let i = 0; i <= steps; i++) {
    const t = steps ? i / steps : 0;
    px(ctx, Math.round(x0 + (x1 - x0) * t), Math.round(y0 + (y1 - y0) * t), 1, 1, color);
  }
}

function panel(ctx, x, y, w, h) {
  px(ctx, x, y, w, h, Z.panelLine);
  px(ctx, x + 1, y + 1, w - 2, h - 2, Z.panel);
}

function closeHair(ctx, look, back) {
  const c = look.hair;
  const style = look.hairStyle;
  if (back) {
    if (style === 'long') { px(ctx, 54, 18, 8, 48, c); px(ctx, 98, 18, 8, 48, c); }
    if (style === 'ponytail') px(ctx, 100, 18, 8, 26, c);
    return;
  }
  switch (style) {
    case 'buzz': px(ctx, 60, 12, 40, 6, c); break;
    case 'bob': px(ctx, 56, 10, 48, 12, c); px(ctx, 56, 22, 6, 26, c); px(ctx, 98, 22, 6, 26, c); px(ctx, 62, 22, 36, 4, c); break;
    case 'fluffy': px(ctx, 56, 8, 48, 14, c); px(ctx, 60, 5, 10, 3, c); px(ctx, 74, 4, 12, 4, c); px(ctx, 90, 5, 10, 3, c); px(ctx, 56, 22, 5, 8, c); px(ctx, 99, 22, 5, 8, c); break;
    case 'long': px(ctx, 58, 10, 44, 12, c); px(ctx, 58, 22, 4, 10, c); px(ctx, 98, 22, 4, 10, c); break;
    case 'ponytail': px(ctx, 58, 10, 44, 12, c); px(ctx, 58, 22, 3, 8, c); px(ctx, 99, 22, 3, 8, c); break;
    default: px(ctx, 58, 10, 44, 12, c); px(ctx, 58, 22, 4, 10, c); px(ctx, 98, 22, 4, 10, c);
  }
}

function closeFace(ctx, v) {
  const mood = v.mood;
  // 눈썹
  if (mood === 'angry') { line(ctx, 67, 26, 74, 28, Z.ink); line(ctx, 93, 26, 86, 28, Z.ink); }
  else { px(ctx, 67, 27, 7, 2, shade(v.look.hair, 1)); px(ctx, 86, 27, 7, 2, shade(v.look.hair, 1)); }
  // 눈
  if (mood === 'crying') {
    px(ctx, 68, 33, 6, 1, Z.ink); px(ctx, 86, 33, 6, 1, Z.ink);
    px(ctx, 69, 35, 2, 6, Z.tear); px(ctx, 89, 35, 2, 6, Z.tear);
  } else if (mood === 'shocked') {
    px(ctx, 68, 31, 5, 5, Z.ink); px(ctx, 87, 31, 5, 5, Z.ink); px(ctx, 69, 32, 1, 1, Z.white); px(ctx, 88, 32, 1, 1, Z.white);
  } else {
    px(ctx, 69, 31, 4, 4, Z.ink); px(ctx, 87, 31, 4, 4, Z.ink); px(ctx, 70, 32, 1, 1, Z.white); px(ctx, 88, 32, 1, 1, Z.white);
  }
  // 코
  px(ctx, 79, 38, 2, 5, shade(v.look.skin, 0.85));
  // 입
  if (mood === 'shocked') px(ctx, 77, 47, 6, 5, Z.ink);
  else if (mood === 'calm') { px(ctx, 75, 48, 1, 1, Z.ink); px(ctx, 76, 49, 8, 1, Z.ink); px(ctx, 84, 48, 1, 1, Z.ink); }
  else if (mood === 'nervous') { [0, 2, 4, 6, 8].forEach((d, i) => px(ctx, 75 + d, 48 + (i % 2), 2, 1, Z.ink)); }
  else if (mood === 'angry' || mood === 'crying') { px(ctx, 76, 50, 8, 1, Z.ink); px(ctx, 75, 51, 1, 1, Z.ink); px(ctx, 84, 51, 1, 1, Z.ink); }
  else px(ctx, 76, 49, 8, 1, Z.ink);
  if (mood === 'angry') { px(ctx, 64, 42, 4, 2, Z.blush); px(ctx, 92, 42, 4, 2, Z.blush); }
  if (mood === 'nervous' || mood === 'shocked') { px(ctx, 100, 18, 2, 2, Z.sweat); px(ctx, 99, 20, 4, 4, Z.sweat); }
  // 점 (왼쪽 눈 밑)
  if (v.faceMole) px(ctx, 68, 40, 2, 2, Z.mole);
}

function closeGlasses(ctx, g) {
  const t = g.thick ? 3 : 1;
  const frame = (x) => {
    px(ctx, x, 29, 12, t, Z.ink); px(ctx, x, 38 - t + 1, 12, t, Z.ink);
    px(ctx, x, 29, t, 10, Z.ink); px(ctx, x + 12 - t, 29, t, 10, Z.ink);
  };
  frame(65);
  frame(83);
  px(ctx, 77, 31, 6, 1, Z.ink);
  px(ctx, 60, 31, 5, t, Z.ink);
  px(ctx, 95, 31, 5, t, Z.ink);
  if (g.glint) { px(ctx, 93, 29, 2, 2, Z.button); px(ctx, 94, 29, 1, 1, Z.lens); }
}

function closeWatch(ctx, w, x, y) {
  px(ctx, x - 1, y + 2, 13, 6, Z.watchBand);
  if (w.type === 'digital') {
    px(ctx, x, y, 11, 10, Z.ink);
    px(ctx, x + 1, y + 1, 9, 8, Z.digital);
    px(ctx, x + 2, y + 3, 2, 4, Z.digit); px(ctx, x + 5, y + 3, 1, 1, Z.digit); px(ctx, x + 5, y + 5, 1, 1, Z.digit); px(ctx, x + 7, y + 3, 2, 4, Z.digit);
    return;
  }
  px(ctx, x, y, 11, 11, Z.ink);
  px(ctx, x + 1, y + 1, 9, 9, Z.watchFace);
  const cx = x + 5, cy = y + 5;
  [0, 3, 6, 9].forEach((k) => {
    const a = (k / 12) * Math.PI * 2;
    px(ctx, cx + Math.round(Math.sin(a) * 4), cy - Math.round(Math.cos(a) * 4), 1, 1, Z.print);
  });
  const ma = (w.m / 60) * Math.PI * 2;
  const ha = (((w.h % 12) + w.m / 60) / 12) * Math.PI * 2;
  for (let r = 0; r <= 4; r++) px(ctx, cx + Math.round(Math.sin(ma) * r), cy - Math.round(Math.cos(ma) * r), 1, 1, Z.ink);
  for (let r = 0; r <= 2; r++) px(ctx, cx + Math.round(Math.sin(ha) * r), cy - Math.round(Math.cos(ha) * r), 1, 1, '#c0392b');
}

function closePen(ctx, fake, x, y, vertical) {
  if (vertical) {
    px(ctx, x, y, 3, 20, Z.pen);
    px(ctx, x, y, 3, 6, Z.penCap);
    if (!fake) px(ctx, x, y + 6, 3, 2, Z.penBand);
    else { px(ctx, x + 1, y, 1, 1, Z.lens); }
    return;
  }
  px(ctx, x, y, 22, 3, Z.pen);
  px(ctx, x + 16, y, 6, 3, Z.penCap);
  if (!fake) px(ctx, x + 14, y, 2, 3, Z.penBand);
  else px(ctx, x + 21, y + 1, 1, 1, Z.lens);
}

function idInset(ctx, v) {
  panel(ctx, 3, 3, 38, 50);
  px(ctx, 5, 5, 34, 46, Z.card);
  px(ctx, 5, 5, 34, 5, Z.cardHead);
  // 사진
  const x = 11, y = 13;
  px(ctx, x, y, 22, 28, '#dde3ea');
  px(ctx, x + 5, y + 6, 12, 14, v.look.skin);
  px(ctx, x + 4, y + 3, 14, 5, v.look.hair);
  px(ctx, x + 7, y + 11, 2, 2, Z.ink); px(ctx, x + 13, y + 11, 2, 2, Z.ink);
  px(ctx, x + 9, y + 16, 4, 1, Z.ink);
  px(ctx, x + 3, y + 21, 16, 7, v.look.clothes.body);
  if (v.idPhoto.mole) px(ctx, x + 7, y + 14, 2, 2, Z.mole);
  px(ctx, 8, 44, 28, 2, Z.print); px(ctx, 8, 48, 18, 1, Z.print);
}

function glassesInset(ctx, v) {
  panel(ctx, 116, 3, 41, 24);
  const t = v.glasses.thick ? 3 : 1;
  const frame = (x) => {
    px(ctx, x, 9, 14, t, Z.white); px(ctx, x, 19 - t + 1, 14, t, Z.white);
    px(ctx, x, 9, t, 11, Z.white); px(ctx, x + 14 - t, 9, t, 11, Z.white);
  };
  frame(119);
  frame(139);
  px(ctx, 133, 11, 6, 1, Z.white);
  if (v.glasses.glint) px(ctx, 151, 9, 2, 2, Z.lens);
}

function pocketsInset(ctx, v) {
  panel(ctx, 116, 3, 41, 30);
  px(ctx, 120, 8, 12, 8, Z.card);
  px(ctx, 120, 8, 12, 2, Z.cardHead);
  px(ctx, 135, 9, 18, 2, Z.pen);
  px(ctx, 135, 13, 18, 2, Z.pen);
  v.pockets.forEach((item) => {
    if (item === 'phone') { px(ctx, 121, 18, 9, 13, Z.ink); px(ctx, 122, 19, 7, 10, '#3a4a6a'); }
    else { px(ctx, 136, 21, 12, 8, Z.white); px(ctx, 136, 24, 12, 1, Z.print); }
  });
}

function drawCloseup(ctx, v) {
  ctx.imageSmoothingEnabled = false;
  const look = v.look;
  const cl = look.clothes;
  // 배경
  px(ctx, 0, 0, CLOSE_W, 64, Z.wall);
  px(ctx, 0, 52, CLOSE_W, 44, Z.locker);
  for (let x = 0; x < CLOSE_W; x += 26) px(ctx, x, 52, 1, 44, Z.lockerLine);

  closeHair(ctx, look, true);

  // 몸
  const sleeveCol = cl.body;
  px(ctx, 42, 64, 76, 34, cl.body);
  px(ctx, 38, 68, 4, 30, cl.body);
  px(ctx, 118, 68, 4, 30, cl.body);
  if (v.waist) { px(ctx, 118, 84, 7, 12, cl.body); px(ctx, 119, 85, 5, 1, shade(cl.body, 1.25)); }
  if (v.buzz) { [[127, 86], [129, 85], [131, 86], [127, 90], [129, 89], [131, 90]].forEach(([x, y]) => px(ctx, x, y, 2, 1, Z.buzz)); }
  if (cl.kind === 'uniform') { px(ctx, 72, 64, 16, 12, cl.trim); line(ctx, 72, 64, 79, 78, shade(cl.body, 0.7)); line(ctx, 88, 64, 81, 78, shade(cl.body, 0.7)); }
  else if (cl.kind === 'shirt') { px(ctx, 79, 64, 2, 34, shade(cl.body, 0.85)); line(ctx, 72, 64, 79, 70, cl.trim); line(ctx, 88, 64, 81, 70, cl.trim); }
  else if (cl.kind === 'hoodie') { px(ctx, 66, 64, 28, 4, cl.trim); px(ctx, 72, 68, 1, 10, Z.white); px(ctx, 87, 68, 1, 10, Z.white); }
  else { [74, 82, 90].forEach((y) => px(ctx, 42, y, 76, 1, cl.trim)); }
  if (v.pocketBulge) {
    const w = v.pocketBulge === 'phone' ? 11 : 7;
    const h = v.pocketBulge === 'phone' ? 12 : 6;
    px(ctx, 46, 82, w, h, shade(cl.body, 0.75));
    px(ctx, 46, 82, w, 1, shade(cl.body, 1.3));
  }
  // 단추와 스티커
  [70, 77, 84, 91].forEach((y, i) => {
    const big = v.bigButton && i === 1;
    const size = big ? 6 : 3;
    const bx = 80 - Math.floor(size / 2);
    px(ctx, bx, y - Math.floor(size / 2), size, size, Z.button);
    if (big) px(ctx, bx + 1, y - 2, 2, 1, Z.shine);
    const missing = v.sticker === 'missing' && i === 1;
    if (v.sticker !== 'none' && !missing) {
      px(ctx, 78, y - 2, 5, 5, Z.sticker);
      px(ctx, 78, y + 2, 5, 1, Z.stickerEdge);
      if (v.sticker === 'peeled' && i === 2) { px(ctx, 82, y - 2, 1, 2, Z.white); px(ctx, 81, y - 2, 1, 1, Z.white); }
    }
  });

  // 목, 머리, 귀
  px(ctx, 72, 56, 16, 10, shade(look.skin, 0.92));
  px(ctx, 60, 14, 40, 44, look.skin);
  px(ctx, 62, 58, 36, 2, look.skin);
  px(ctx, 53, 29, 8, 17, look.skin);
  px(ctx, 99, 29, 8, 17, look.skin);
  px(ctx, 53, 29, 1, 17, shade(look.skin, 0.85));
  px(ctx, 106, 29, 1, 17, shade(look.skin, 0.85));
  px(ctx, 55, 33, 3, 8, shade(look.skin, 0.8));
  px(ctx, 102, 33, 3, 8, Z.canal);
  if (v.earBlob) { px(ctx, 102, 35, 3, 4, '#f6d2b0'); px(ctx, 102, 35, 1, 1, Z.white); }
  closeHair(ctx, look, false);
  closeFace(ctx, v);
  if (v.glasses && !v.glasses.off) closeGlasses(ctx, v.glasses);

  // 책상
  px(ctx, 0, 96, CLOSE_W, 24, Z.desk);
  px(ctx, 0, 96, CLOSE_W, 1, Z.deskEdge);
  if (v.paper !== 'none') {
    px(ctx, 46, 99, 44, 19, Z.paper);
    for (let y = 101; y < 117; y += 3) px(ctx, 49, y, 34, 1, Z.print);
    if (v.paper === 'scribbled') {
      [[52, 102, 66, 106], [70, 103, 84, 101], [55, 109, 61, 114], [64, 112, 80, 110], [73, 115, 86, 114]].forEach(([a, b, c, d]) => line(ctx, a, b, c, d, Z.pencil));
      px(ctx, 50, 104, 3, 3, Z.pencil);
    }
    px(ctx, 118, 99, 38, 19, Z.omr);
    const filled = Math.round(v.omr * 20);
    let k = 0;
    for (let col = 0; col < 4; col++) {
      for (let row = 0; row < 5; row++) {
        const x = 121 + col * 9;
        const y = 101 + row * 3;
        px(ctx, x, y, 2, 2, Z.omrDot);
        if (k < filled) px(ctx, x + 3 + ((k * 7) % 3) * 1, y, 2, 2, Z.omrFill);
        k++;
      }
    }
  }
  // 수험표(작게)
  px(ctx, 6, 101, 18, 13, Z.card);
  px(ctx, 6, 101, 18, 3, Z.cardHead);
  px(ctx, 8, 105, 6, 7, '#dde3ea');

  // 팔과 손
  const sleeveUpY = 86;
  const arm = (x, w, handX) => {
    px(ctx, x, 70, w, 30, sleeveCol);
    if (v.sleeves) { px(ctx, x, sleeveUpY, w, 14, shade(look.skin, 0.95)); px(ctx, x - 1, sleeveUpY - 2, w + 2, 3, shade(sleeveCol, 0.8)); }
    px(ctx, handX, 98, 11, 6, look.skin);
  };
  arm(30, 12, 32);
  const pose = v.pose;
  if (pose === 'glasses' || pose === 'ear') {
    const hy = pose === 'glasses' ? 27 : 32;
    const hx = pose === 'glasses' ? 92 : 98;
    px(ctx, 108, 40, 10, 58, sleeveCol);
    line(ctx, 112, 40, hx + 4, hy + 6, sleeveCol);
    px(ctx, hx + 2, hy + 4, 10, 12, sleeveCol);
    px(ctx, hx, hy, 9, 9, look.skin);
  } else if (pose === 'belly') {
    px(ctx, 118, 70, 12, 30, sleeveCol);
    px(ctx, 112, 98, 11, 6, look.skin);
    px(ctx, 42, 84, 22, 8, sleeveCol);
    px(ctx, 62, 83, 10, 9, look.skin);
  } else {
    arm(118, 12, 114);
  }
  if (pose === 'tap') { px(ctx, 112, 95, 2, 3, look.skin); px(ctx, 116, 95, 2, 3, look.skin); px(ctx, 113, 91, 1, 2, Z.ink); px(ctx, 117, 90, 1, 2, Z.ink); }
  if (v.watch) closeWatch(ctx, v.watch, 31, 87);
  if (v.paper !== 'none') {
    if (pose === 'penUp') closePen(ctx, v.fakePen, 117, 78, true);
    else closePen(ctx, v.fakePen, 90, 112, false);
  }

  // 확대 창
  if (v.idPhoto) idInset(ctx, v);
  if (v.glasses && v.glasses.off) glassesInset(ctx, v);
  else if (v.pockets) pocketsInset(ctx, v);
}

// ---- src/card.js
// 결과 공유 카드(1080x1350)


const W = 1080;
const H = 1350;
const K = { page: '#1b1f27', box: '#0d1015', line: '#f2efe6', text: '#f4f1e8', dim: '#a9b1bb', yellow: '#ffd84a', shadow: '#6b4f00', red: '#ff6b6b', green: '#69db7c' };
const FONT = '"Galmuri11", "Apple SD Gothic Neo", monospace';

function box(ctx, x, y, w, h) {
  ctx.fillStyle = K.box;
  ctx.fillRect(x - 9, y - 9, w + 18, h + 18);
  ctx.fillStyle = K.line;
  ctx.fillRect(x - 6, y - 6, w + 12, h + 12);
  ctx.fillStyle = K.box;
  ctx.fillRect(x, y, w, h);
}

function text(ctx, str, x, y, size, color, weight = 400) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  return ctx.measureText(str).width;
}

function renderCard(state) {
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  const r = state.result;
  ctx.textBaseline = 'top';
  ctx.fillStyle = K.page;
  ctx.fillRect(0, 0, W, H);

  // 장면
  const scene = document.createElement('canvas');
  scene.width = SCENE_W;
  scene.height = SCENE_H;
  drawScene(scene.getContext('2d'), state, { reduceMotion: true });
  const sw = SCENE_W * 3;
  const sh = SCENE_H * 3;
  const sx = (W - sw) / 2;
  box(ctx, sx, 60, sw, sh);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(scene, sx, 60, sw, sh);

  // 등급 상자
  const by = 60 + sh + 48;
  const tx = 60;
  box(ctx, tx, by, W - 120, H - by - 60);
  let y = by + 36;
  text(ctx, `수능 감독관 · 시험실 ${state.room}`, tx + 40, y, 33, K.dim);
  y += 64;
  const g = String(r.grade);
  text(ctx, g, tx + 44, y + 6, 132, K.shadow, 700);
  const gw = text(ctx, g, tx + 40, y, 132, K.yellow, 700);
  text(ctx, '등급', tx + 56 + gw, y + 70, 55, K.text, 700);
  y += 160;
  text(ctx, r.title, tx + 40, y, 44, K.yellow, 700);
  y += 76;

  r.schemes.forEach((sc) => {
    const name = SCHEMES[sc.key].name;
    const line = sc.state === 'caught' ? `${sc.seat}번 ${name} 적발` : sc.state === 'flagged' ? `${sc.seat}번 ${name} 사후 조사` : `${sc.seat}번 ${name} 놓침`;
    text(ctx, line, tx + 40, y, 34, sc.state === 'missed' ? K.red : K.green);
    y += 50;
  });
  y += 8;
  text(ctx, `예방 ${r.prevented} · 처리 ${r.reported} · 봐줌 ${r.excused} · 놓침 ${r.missedSlip} · 민원 ${r.complaints}`, tx + 40, y, 30, K.dim);
  return canvas;
}

// 화면 연결: 교실 그림 → 확대 그림 → 행동 → 수첩(스냅숏 앨범)




const $ = (id) => document.getElementById(id);
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const sceneCtx = $('scene').getContext('2d');
const closeCtx = $('closeup').getContext('2d');

let state = null;
let selected = null;
let viewing = null; // 지금 확대 창에 띄운 log 번호
let caption = null; // 확대 창 아래 한 줄 { text, kind }
let cardBlob = null;

// ---------- 시작/화면 전환 ----------
function roomFromHash() {
  const m = /room-(\d{4})/.exec(location.hash || '');
  return m ? normalizeRoom(m[1]) : null;
}

function setHash(room) {
  try { history.replaceState(null, '', `#room-${room}`); } catch (e) { /* 무시 */ }
}

function start(room) {
  state = newGame(room);
  selected = null;
  viewing = null;
  caption = null;
  setHash(room);
  showScreen('game');
  render();
  window.scrollTo(0, 0);
}

function showScreen(name) {
  ['title', 'game', 'result'].forEach((id) => { $(id).hidden = id !== name; });
}

// ---------- 렌더링 ----------
function phaseName() {
  const p = PERIODS[state.period];
  switch (state.phase) {
    case 'precheck': return '입실 점검';
    case 'exam': return `${p.label} ${p.subject}`;
    case 'ending': case 'bell': case 'break': return `${p.label} 종료`;
    case 'report': return '감독 보고서';
    default: return '';
  }
}

function budgetText() {
  switch (state.phase) {
    case 'precheck': return `남은 ${PRECHECK.minutes - state.minutes}분`;
    case 'exam': return state.period > 0 ? `확인 ${state.idLeft} · 보기 ${state.patrolLeft}` : `보기 ${state.patrolLeft}`;
    case 'break': return '쉬는 시간';
    default: return '';
  }
}

function render() {
  if (!state) return;
  if (state.phase === 'result') { renderResult(); return; }
  $('hud-time').textContent = clockText(state);
  $('hud-phase').textContent = phaseName();
  $('hud-budget').textContent = budgetText();
  const comp = $('hud-complaints');
  comp.textContent = `민원 ${state.complaints}`;
  comp.className = state.complaints >= 3 ? 'warn' : '';
  renderSeats();
  renderViewer();
  renderActions();
  renderAlbum();
  renderTicker();
  drawNow();
}

function renderSeats() {
  const grid = $('seat-grid');
  grid.innerHTML = '';
  state.students.forEach((s) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s.seat;
    b.setAttribute('aria-pressed', String(selected === s.seat));
    b.setAttribute('aria-label', `${label(s)}${s.flagged ? ', 의심 표시됨' : ''}`);
    if (s.flagged) b.classList.add('flagged');
    if (s.slipState === 'reported' || s.schemeState === 'caught') b.classList.add('out');
    b.addEventListener('click', () => select(s.seat));
    grid.appendChild(b);
  });
}

function renderViewer() {
  const s = selected ? student(state, selected) : null;
  const entry = viewing != null ? state.log[viewing] : null;
  $('v-title').textContent = s ? label(s) : '수험생을 고르세요';
  $('v-time').textContent = entry ? `${entry.time} · ${entry.text}` : s ? '아직 가까이 보지 않았다' : '';
  closeCtx.fillStyle = '#000';
  closeCtx.fillRect(0, 0, CLOSE_W, CLOSE_H);
  if (entry && entry.view) drawCloseup(closeCtx, entry.view);
  else drawPlaceholder();
  const cap = $('v-caption');
  cap.textContent = caption ? caption.text : '';
  cap.className = `v-caption${caption ? ` k-${caption.kind}` : ''}`;
}

function drawPlaceholder() {
  closeCtx.fillStyle = '#0d1015';
  closeCtx.fillRect(0, 0, CLOSE_W, CLOSE_H);
  closeCtx.fillStyle = '#2c333e';
  closeCtx.fillRect(60, 18, 40, 44);
  closeCtx.fillRect(42, 64, 76, 34);
  closeCtx.fillRect(0, 96, CLOSE_W, 24);
}

function btn(box, text, sub, onClick, opts = {}) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'act' + (opts.cls ? ` ${opts.cls}` : '');
  b.innerHTML = `<span>${esc(text)}</span>${sub ? `<small>${esc(sub)}</small>` : ''}`;
  b.disabled = !!opts.disabled;
  if (opts.pressed != null) b.setAttribute('aria-pressed', String(opts.pressed));
  b.addEventListener('click', onClick);
  box.appendChild(b);
}

function renderActions() {
  const box = $('actions');
  box.innerHTML = '';
  if (state.pending) {
    btn(box, '부정행위로 처리', '답안지 회수', () => act(() => resolvePending(state, 'report')), { cls: 'danger' });
    btn(box, '봐주기', '주의만 준다', () => act(() => resolvePending(state, 'excuse')));
    return;
  }
  const s = selected ? student(state, selected) : null;
  const flag = () => {
    if (s) btn(box, s.flagged ? '의심 지우기' : '의심 표시', '무료', () => { toggleFlag(state, s.seat); render(); }, { cls: 'flag', pressed: s.flagged });
  };
  const cost = (k) => (s && s.checked[k] ? '완료' : `${PRECHECK.cost[k]}분`);

  if (state.phase === 'precheck') {
    if (s) {
      btn(box, '사진 대조', cost('id'), () => act(() => precheck(state, 'id', s.seat)), { disabled: !canPrecheck(state, 'id', s.seat) });
      btn(box, '소매·단추', cost('clothes'), () => act(() => precheck(state, 'clothes', s.seat)), { disabled: !canPrecheck(state, 'clothes', s.seat) });
      if (s.look.glasses) btn(box, '안경 벗겨 보기', cost('glasses'), () => act(() => precheck(state, 'glasses', s.seat)), { disabled: !canPrecheck(state, 'glasses', s.seat) });
      btn(box, '소지품 보기', cost('pockets'), () => act(() => precheck(state, 'pockets', s.seat)), { disabled: !canPrecheck(state, 'pockets', s.seat) });
      flag();
    }
    btn(box, '전자기기 안내', state.announced ? '완료' : '1분 · 교실 전체', () => act(() => precheck(state, 'announce')), { disabled: !canPrecheck(state, 'announce') });
    btn(box, '1교시 시작', '', () => act(() => finishPrecheck(state)), { cls: 'main' });
  } else if (state.phase === 'exam') {
    if (s) {
      btn(box, '가까이 보기', `${state.patrolLeft}회 남음`, () => act(() => patrol(state, s.seat)), { disabled: !canPatrol(state, s.seat) });
      if (state.period > 0) btn(box, '본인 확인', `${state.idLeft}회 · 사진${state.period <= 2 ? '·소매' : ''}${state.period === 2 ? '·소지품' : ''}`, () => act(() => idCheck(state, s.seat)), { disabled: !canIdCheck(state, s.seat) });
      flag();
    }
    btn(box, `${PERIODS[state.period].label} 끝내기`, '', () => act(() => endExam(state)), { cls: 'main' });
  } else if (state.phase === 'break') {
    suspects(state).forEach((x) => {
      btn(box, `${x.seat}번 정밀 점검`, '금속탐지기 · 쉬는 시간 1명', () => { selected = x.seat; act(() => afterCheck(state, x.seat)); }, { disabled: !canAfterCheck(state, x.seat) });
    });
    const last = state.period === PERIODS.length - 1;
    btn(box, last ? '보고서로' : `${PERIODS[state.period + 1].label}로`, '', () => act(() => nextPeriod(state)), { cls: 'main' });
  } else if (state.phase === 'report') {
    flag();
    btn(box, '보고서 제출', `사후 조사: ${suspects(state).map((x) => `${x.seat}번`).join(', ') || '없음'}`, () => act(() => submitReport(state)), { cls: 'main' });
  }
}

function renderAlbum() {
  const box = $('album-box');
  const shots = selected ? snapshots(state, selected) : [];
  box.hidden = !shots.length;
  const album = $('album');
  album.innerHTML = '';
  shots.forEach((e) => {
    const idx = state.log.indexOf(e);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'shot';
    b.setAttribute('aria-current', String(idx === viewing));
    b.setAttribute('aria-label', `${e.time} ${e.text}`);
    const c = document.createElement('canvas');
    c.width = CLOSE_W;
    c.height = CLOSE_H;
    drawCloseup(c.getContext('2d'), e.view);
    const t = document.createElement('span');
    t.textContent = e.time;
    b.append(c, t);
    b.addEventListener('click', () => { viewing = idx; caption = null; render(); });
    album.appendChild(b);
  });
}

// 이번 교시에 앞에서 보인 것 (짧은 글)
function renderTicker() {
  let from = 0;
  state.log.forEach((e, i) => { if (e.kind === 'period') from = i; });
  const items = state.log.slice(from).filter((e) => !e.view && e.kind !== 'decision');
  $('ticker').innerHTML = items.map((e) => `<li><span class="t">${e.time}</span><span class="k-${e.kind}">${esc(e.text)}</span></li>`).join('');
}

function renderResult() {
  showScreen('result');
  const r = state.result;
  $('r-room').textContent = state.room;
  $('r-grade').textContent = r.grade;
  $('r-title').textContent = r.title;
  $('r-stats').textContent = `점수 ${r.score} · 민원 ${r.complaints}`;
  const list = $('r-truth');
  list.innerHTML = '';
  state.students.forEach((s) => {
    const t = truth(s);
    if (!s.scheme && !s.slip && !s.flagged) return;
    const cls = s.scheme ? 'scheme' : s.slip ? 'slip' : 'clean';
    const out = outcome(s);
    const li = document.createElement('li');
    li.innerHTML = `<span class="no">${s.seat}번</span><div><span class="tag ${cls}">${t.tag}${t.name ? ` · ${esc(t.name)}` : ''}</span>${esc(s.name)}${out ? `<span class="out">${esc(out)}</span>` : ''}<p>${esc(t.text)}</p></div>`;
    const shots = snapshots(state, s.seat);
    if (shots.length) {
      const c = document.createElement('canvas');
      c.width = CLOSE_W;
      c.height = CLOSE_H;
      drawCloseup(c.getContext('2d'), shots[shots.length - 1].view);
      li.lastChild.appendChild(c);
    }
    list.appendChild(li);
  });
  drawScene($('result-scene').getContext('2d'), state, { t: 0, reduceMotion: true });
  window.scrollTo(0, 0);
}

function esc(str) {
  return String(str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ---------- 입력 ----------
function select(seat) {
  selected = seat;
  const shots = snapshots(state, seat);
  viewing = shots.length ? state.log.indexOf(shots[shots.length - 1]) : null;
  caption = null;
  render();
}

// 행동 실행 후, 새로 생긴 기록 중 그림이 있으면 확대 창에 띄우고 결과 글은 한 줄로 보여 준다.
function act(fn) {
  const from = state.log.length;
  fn();
  const fresh = state.log.slice(from);
  const shot = fresh.map((e, i) => ({ e, i: from + i })).filter((x) => x.e.view).pop();
  if (shot) { viewing = shot.i; selected = shot.e.seat; }
  else if (selected) {
    const shots = snapshots(state, selected);
    viewing = shots.length ? state.log.indexOf(shots[shots.length - 1]) : null;
  }
  const important = fresh.filter((e) => ['found', 'caught', 'clean', 'prevent', 'decision'].includes(e.kind)).pop();
  caption = important ? { text: important.text, kind: important.kind } : null;
  if (state.pending) caption = { text: state.pending.text, kind: 'found' };
  render();
}

$('scene').addEventListener('click', (ev) => {
  if (!state) return;
  const rect = ev.currentTarget.getBoundingClientRect();
  const seat = seatAt(((ev.clientX - rect.left) / rect.width) * SCENE_W, ((ev.clientY - rect.top) / rect.height) * SCENE_H);
  if (seat) select(seat);
});

$('start-btn').addEventListener('click', () => start(normalizeRoom($('room-input').value) || randomRoom()));
$('room-input').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') $('start-btn').click(); });
$('how-btn').addEventListener('click', (ev) => {
  const how = $('how');
  how.hidden = !how.hidden;
  ev.currentTarget.setAttribute('aria-expanded', String(!how.hidden));
});
$('btn-retry').addEventListener('click', () => start(state.room));
$('btn-new').addEventListener('click', () => start(randomRoom()));
$('btn-copy').addEventListener('click', async (ev) => {
  const b = ev.currentTarget;
  try { await navigator.clipboard.writeText(String(state.room)); b.textContent = `복사됨 · ${state.room}`; }
  catch (e) { b.textContent = `시험실 번호 ${state.room}`; }
});
$('btn-card').addEventListener('click', async () => {
  try { await document.fonts.load('20px "Galmuri11"'); await document.fonts.load('700 20px "Galmuri11"'); } catch (e) { /* 기본 글꼴 */ }
  const canvas = renderCard(state);
  $('card-img').src = canvas.toDataURL('image/png');
  cardBlob = null;
  canvas.toBlob((b) => { cardBlob = b; });
  $('card-overlay').hidden = false;
});
$('btn-close-card').addEventListener('click', () => { $('card-overlay').hidden = true; });
$('btn-share').addEventListener('click', async (ev) => {
  const b = ev.currentTarget;
  const text = `수능 감독관 ${state.result.grade}등급 · ${state.result.title}. 시험실 ${state.room}에서 붙어 보자.`;
  try {
    const file = cardBlob ? new File([cardBlob], `suneung-${state.room}.png`, { type: 'image/png' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
    if (navigator.share) { await navigator.share({ text }); return; }
    throw new Error('no share');
  } catch (e) {
    b.textContent = '이미지를 길게 눌러 저장하세요';
  }
});

// ---------- 그리기 ----------
let lastDraw = 0;
function drawNow(t = performance.now()) {
  if (state && state.phase !== 'result') drawScene(sceneCtx, state, { t, selected, reduceMotion });
}
function frame(t) {
  if (state && !$('game').hidden && t - lastDraw > 90) { lastDraw = t; drawNow(t); }
  requestAnimationFrame(frame);
}

// ---------- 부팅 ----------
function boot(data) {
  if (data && data.state && data.state.v === 3) {
    state = data.state;
    selected = data.selected || null;
    viewing = data.viewing != null ? data.viewing : null;
    showScreen(state.phase === 'result' ? 'result' : 'game');
    render();
  } else {
    showScreen('title');
    const r = roomFromHash();
    if (r) $('room-input').value = String(r);
  }
  requestAnimationFrame(frame);
}

const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ state, selected, viewing }));
if (hot && hot.ready) hot.ready(boot);
else boot(hot && hot.data ? hot.data : {});

})();
</script>
