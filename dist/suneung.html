:root {
  --page: #1b1f27;
  --box: #0d1015;
  --line: #f2efe6;
  --text: #f4f1e8;
  --dim: #a9b1bb;
  --yellow: #ffd84a;
  --red: #ff6b6b;
  --orange: #ffa94d;
  --green: #69db7c;
  --font: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  color-scheme: dark;
}

html, body { height: auto; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.75;
  word-break: keep-all;
  overflow-wrap: anywhere;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
  -webkit-font-smoothing: none;
}

[hidden] { display: none !important; }

.app { max-width: 520px; margin: 0 auto; }
.screen { display: flex; flex-direction: column; gap: 14px; }

.box {
  background: var(--box);
  border: 3px solid var(--line);
  box-shadow: 0 0 0 3px var(--box);
  padding: 14px 16px;
  margin: 3px;
}
.dim { color: var(--dim); }
b { color: var(--yellow); font-weight: 700; }

/* 시작 화면 */
.intro { display: flex; flex-direction: column; gap: 10px; }
.intro p { margin: 0; }
.intro h1 {
  margin: 4px 0;
  font-size: 44px;
  line-height: 1.2;
  font-weight: 700;
  color: var(--yellow);
  text-shadow: 3px 3px 0 #6b4f00;
}
.field { display: block; margin-bottom: 6px; }
input {
  font: inherit;
  font-size: 24px;
  letter-spacing: 0.15em;
  width: 100%;
  max-width: 240px;
  box-sizing: border-box;
  padding: 8px 10px;
  background: #000;
  color: var(--text);
  border: 3px solid var(--dim);
  border-radius: 0;
  margin-bottom: 10px;
}
input:focus-visible { outline: none; border-color: var(--yellow); }
input::placeholder { color: #6c737c; font-size: 17px; letter-spacing: 0; }
.rules p { margin: 0 0 10px; }
.rules p:last-child { margin-bottom: 0; }

/* 메뉴(선택지) */
.menu { display: flex; flex-direction: column; gap: 2px; }
.menu .item {
  font: inherit;
  font-size: 18px;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 48px;
  padding: 6px 8px 6px 30px;
  background: transparent;
  color: var(--text);
  border: 0;
  cursor: pointer;
  position: relative;
}
.menu .item::before { content: "▶"; position: absolute; left: 6px; color: transparent; }
.menu .item:hover:not(:disabled)::before,
.menu .item:focus-visible::before { color: var(--yellow); }
.menu .item:hover:not(:disabled), .menu .item:focus-visible { background: #1f2530; outline: none; }
.menu .item:disabled { color: #5d646e; cursor: not-allowed; }
.menu .item .cost { color: var(--dim); font-size: 15px; white-space: nowrap; }
.menu .item.main { color: var(--yellow); }
.menu .item.danger { color: var(--red); }
.menu .sep { height: 2px; background: #2c333e; margin: 6px 0; }
.menu .menu-label { color: var(--dim); font-size: 15px; padding: 2px 8px; }

/* HUD */
.hud {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  align-items: baseline;
  padding: 8px 14px;
  font-size: 16px;
}
.hud .time { font-size: 22px; color: var(--yellow); }
.hud .warn { color: var(--red); }

/* 장면 */
#scene, #result-scene {
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 240 / 204;
  image-rendering: pixelated;
  border: 3px solid var(--line);
  box-shadow: 0 0 0 3px var(--box);
  margin: 3px;
  width: calc(100% - 6px);
  box-sizing: border-box;
  touch-action: manipulation;
  cursor: pointer;
}
#result-scene { cursor: default; }

/* 좌석 버튼 */
.seat-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.seat-grid button {
  font: inherit;
  font-size: 17px;
  min-height: 44px;
  background: var(--box);
  color: var(--text);
  border: 2px solid #4a525e;
  border-radius: 0;
  cursor: pointer;
  position: relative;
  padding: 0;
}
.seat-grid button[aria-pressed="true"] { border-color: var(--yellow); color: var(--yellow); background: #2a2410; }
.seat-grid button.flagged::after { content: "!"; position: absolute; top: 0; right: 4px; color: var(--yellow); font-size: 14px; }
.seat-grid button.out { color: #5d646e; text-decoration: line-through; }
.seat-grid button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; }

/* 대화창 */
.dialog { min-height: 112px; font-size: 18px; }
.dialog p { margin: 0 0 10px; }
.dialog p:last-child { margin-bottom: 0; }
.dialog .who { color: var(--yellow); margin-right: 6px; }
.dialog .t { color: var(--dim); font-size: 15px; margin-right: 8px; }
.k-found, .k-caught { color: var(--red); }
.k-prevent { color: var(--green); }
.k-alert { color: var(--orange); }
.k-period { color: var(--yellow); }
.k-ambient { color: var(--dim); }

/* 수첩 */
.notes h2, .box h2 { margin: 0 0 8px; font-size: 18px; color: var(--yellow); font-weight: 700; }
.notes ol, .log ol, .truth { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.notes li, .log li { font-size: 16px; }
.notes .t, .log .t { color: var(--dim); font-size: 14px; margin-right: 8px; }
.log summary { cursor: pointer; font-size: 17px; color: var(--dim); }
.log[open] summary { margin-bottom: 10px; color: var(--yellow); }

/* 결과 */
.result-head p { margin: 0; }
.grade { font-size: 30px; color: var(--text); }
.grade span { font-size: 72px; color: var(--yellow); line-height: 1.1; margin-right: 4px; text-shadow: 4px 4px 0 #6b4f00; }
.r-title { font-size: 22px; color: var(--yellow); margin-top: 4px !important; }
.truth li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; font-size: 16px; }
.truth .no { font-size: 18px; color: var(--dim); }
.truth .tag { display: inline-block; margin-right: 6px; }
.truth .tag.scheme { color: var(--red); }
.truth .tag.slip { color: var(--orange); }
.truth .tag.clean { color: var(--green); }
.truth .out { display: block; color: var(--yellow); }
.truth p { margin: 2px 0 0; color: var(--dim); }

/* 카드 */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(5, 7, 10, 0.92);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.overlay-inner { max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 10px; }
.overlay-inner img { width: 100%; height: auto; display: block; image-rendering: pixelated; }

</style>

// ---- src/game.js
// 게임 규칙. 화면과 분리된 순수 로직. 상태는 평범한 JSON 객체다.

// ---------- 난수 ----------
function makeRng(seed) {
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    int: (lo, hi) => lo + Math.floor(next() * (hi - lo + 1)),
    pick: (arr) => arr[Math.floor(next() * arr.length)],
    chance: (p) => next() < p,
    shuffle: (arr) => {
      const out = arr.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    },
  };
}

function normalizeRoom(value) {
  const n = parseInt(String(value).replace(/\D/g, ''), 10);
  if (!Number.isFinite(n) || n < 1000 || n > 9999) return null;
  return n;
}

function randomRoom() {
  return 1000 + Math.floor(Math.random() * 9000);
}

function rngFor(state, salt) {
  return makeRng((Math.imul(state.room, 2654435761) + state.actionIndex * 7919 + salt) >>> 0);
}

function fill(text, n) {
  return text.split('{n}').join(String(n));
}

// ---------- 시각 ----------
function fmt([h, m]) {
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function addMin([h, m], d) {
  const t = h * 60 + m + d;
  return [Math.floor(t / 60), t % 60];
}

function clock(state) {
  const p = PERIODS[state.period];
  switch (state.phase) {
    case 'precheck': return addMin(PRECHECK.start, state.minutes);
    case 'exam': return addMin(p.start, (BUDGET.patrol - state.patrolLeft) * 20 + 5);
    case 'ending':
    case 'bell':
    case 'break': return p.end;
    default: return PERIODS[3].end;
  }
}

function clockText(state) {
  return fmt(clock(state));
}

// ---------- 생성 ----------
function student(state, seat) {
  return state.students[seat - 1];
}

function label(s) {
  return `${s.seat}번 ${s.name}`;
}

function newGame(room) {
  const rng = makeRng(Math.imul(room, 7919) + 101);
  const given = rng.shuffle(GIVEN_NAMES);
  const students = SEATS.map((seat, i) => ({
    seat,
    name: rng.pick(SURNAMES) + given[i],
    look: {
      skin: rng.pick(LOOKS.skin),
      hair: rng.pick(LOOKS.hair),
      hairStyle: rng.pick(LOOKS.hairStyle),
      glasses: rng.chance(0.4),
      clothes: rng.pick(LOOKS.clothes),
    },
    slip: null,
    scheme: null,
    habit: null,
    checked: { id: false, clothes: false, glasses: false, pockets: false },
    sticker: false,
    glassesSeenAM: false,
    slipState: null, // prevented | reported | excused
    schemeState: null, // caught | flagged
    habitSeen: false,
    flagged: false,
    mood: 'normal',
  }));

  // 계획형: 매 판 1명, 45% 확률로 2명. 실수형: 60% 확률로 1명.
  const seatsShuffled = rng.shuffle(SEATS);
  let cursor = 0;
  const schemeKeys = rng.shuffle(Object.keys(SCHEMES)).slice(0, rng.chance(0.45) ? 2 : 1);
  schemeKeys.forEach((key) => {
    const s = students[seatsShuffled[cursor++] - 1];
    s.scheme = key;
    if (SCHEMES[key].needsGlasses) s.look.glasses = true;
  });
  if (rng.chance(0.6)) students[seatsShuffled[cursor++] - 1].slip = rng.pick(Object.keys(SLIPS));
  // 무고한 습관: 나머지 중 70%
  const habitKeys = Object.keys(HABITS);
  students.filter((s) => !s.scheme && !s.slip).forEach((s) => {
    if (!rng.chance(0.7)) return;
    const options = habitKeys.filter((k) => !HABITS[k].needsGlasses || s.look.glasses);
    s.habit = rng.pick(options);
  });

  // 교시별로 앞에서 보이는 사건 배치
  const schedule = PERIODS.map(() => []);
  const bellAt = rng.int(0, 3);
  students.forEach((s) => {
    if (s.habit) {
      const h = HABITS[s.habit];
      let periods;
      if (h.period != null) periods = [h.period];
      else if (h.falls) periods = [rng.int(0, 3)];
      else periods = rng.shuffle([0, 1, 2, 3]).slice(0, rng.int(1, 2));
      periods.forEach((p) => schedule[p].push({ kind: h.falls ? 'sticker' : 'habit', seat: s.seat, text: fill(h.line, s.seat) }));
    }
    if (s.scheme) {
      const sc = SCHEMES[s.scheme];
      const t = sc.tells;
      rng.shuffle(t.periods).slice(0, rng.int(t.count[0], t.count[1])).forEach((p) => {
        schedule[p].push({ kind: 'tell', seat: s.seat, text: fill(rng.pick(t.lines), s.seat) });
      });
      if (t.extra) schedule[t.extra.period].push({ kind: 'tell', seat: s.seat, text: fill(t.extra.text, s.seat) });
      if (sc.stickerFalls) {
        rng.shuffle([0, 1, 2, 3]).slice(0, rng.int(2, 3)).forEach((p) => {
          schedule[p].push({ kind: 'sticker', seat: s.seat, text: `${s.seat}번 수험생의 단추 스티커가 떨어져 있다.` });
        });
      }
    }
  });
  PERIODS.forEach((_, p) => {
    if (rng.chance(0.6)) {
      const options = AMBIENT.filter((a) => a.period == null || a.period === p);
      schedule[p].push({ kind: 'ambient', seat: null, text: rng.pick(options).text });
    }
  });

  const state = {
    v: 2,
    room,
    phase: 'precheck',
    period: 0,
    minutes: 0,
    announced: false,
    alertDone: false,
    idLeft: BUDGET.idCheck,
    patrolLeft: BUDGET.patrol,
    afterLeft: BUDGET.afterCheck,
    complaints: 0,
    actionIndex: 0,
    students,
    schedule: schedule.map((list) => rng.shuffle(list)),
    bellAt,
    pending: null,
    log: [],
    result: null,
  };
  log(state, 'system', '08:10 입실 마감. 30분 안에 본인 확인과 점검을 마쳐야 한다. 끝내지 못한 수험생은 부감독관이 기본 점검(단추 스티커)만 한다.');
  return state;
}

// ---------- 공통 ----------
function log(state, kind, text, seat = null) {
  state.log.push({ time: clockText(state), kind, text, seat });
}

function busy(state) {
  return state.pending != null || state.phase === 'result';
}

function askSlip(state, s, text) {
  const rng = rngFor(state, 9);
  state.pending = { seat: s.seat, text, reaction: rng.pick(SLIPS[s.slip].reaction) };
  s.mood = 'nervous';
  log(state, 'found', text, s.seat);
}

function resolvePending(state, choice) {
  const p = state.pending;
  if (!p) return;
  const s = student(state, p.seat);
  if (choice === 'report') {
    s.slipState = 'reported';
    s.mood = 'crying';
    log(state, 'decision', `부정행위로 처리했다. 답안지를 회수하고 시험본부에 보고했다. "${p.reaction}"`, s.seat);
  } else {
    s.slipState = 'excused';
    s.mood = 'normal';
    log(state, 'decision', `주의만 주고 넘어갔다. "${p.reaction}"`, s.seat);
  }
  state.pending = null;
  state.actionIndex += 1;
  continueAfterPending(state);
}

function toggleFlag(state, seat) {
  if (state.phase === 'result') return;
  const s = student(state, seat);
  s.flagged = !s.flagged;
}

// ---------- 입실 점검 (08:10~08:40) ----------
function precheckCost(state, kind) {
  return PRECHECK.cost[kind];
}

function canPrecheck(state, kind, seat) {
  if (state.phase !== 'precheck' || busy(state)) return false;
  if (state.minutes + PRECHECK.cost[kind] > PRECHECK.minutes) return false;
  if (kind === 'announce') return !state.announced;
  const s = student(state, seat);
  if (!s) return false;
  if (kind === 'glasses' && !s.look.glasses) return false;
  return !s.checked[kind];
}

function precheck(state, kind, seat) {
  if (!canPrecheck(state, kind, seat)) return false;
  const rng = rngFor(state, 1);
  state.minutes += PRECHECK.cost[kind];
  state.actionIndex += 1;

  if (kind === 'announce') {
    state.announced = true;
    log(state, 'action', '"전자기기를 지금 내면 문제없습니다. 시험 시작 후에 나오면 부정행위입니다." 교실 전체에 다시 안내했다.');
    state.students.forEach((s) => {
      if (s.slip && (SLIPS[s.slip].pocket || SLIPS[s.slip].sleeve) && !s.slipState && rng.chance(0.5)) {
        s.slipState = 'prevented';
        log(state, 'prevent', `${s.seat}번 수험생이 머뭇거리다 ${SLIPS[s.slip].sleeve ? '손목에서 시계를 풀어' : '주머니에서 꺼내'} 제출한다.`, s.seat);
      }
    });
  } else {
    const s = student(state, seat);
    s.checked[kind] = true;
    if (kind === 'id') {
      const hint = s.scheme === 'proxy' && rng.chance(0.6);
      log(state, 'check', `본인 확인: ${hint ? rng.pick(PROXY_ID_HINT) : rng.pick(ID_OK)}`, seat);
    } else if (kind === 'clothes') {
      s.sticker = true;
      let text = '소매를 걷게 하고 옷깃과 단추를 확인했다. 단추마다 스티커를 붙였다.';
      if (s.slip && SLIPS[s.slip].sleeve && !s.slipState) {
        s.slipState = 'prevented';
        text += ' 손목에 전자시계가 있어 시험 전에 제출받았다.';
      }
      log(state, 'check', text + schemeHint(s, 'clothes', rng), seat);
    } else if (kind === 'glasses') {
      s.glassesSeenAM = true;
      log(state, 'check', '안경을 벗어 책상에 올리게 했다. 얇은 검은 테의 평범한 안경이다. 모양을 기억해 둔다.' + schemeHint(s, 'glasses', rng), seat);
    } else if (kind === 'pockets') {
      if (s.slip && SLIPS[s.slip].pocket && !s.slipState) {
        s.slipState = 'prevented';
        log(state, 'prevent', `${SLIPS[s.slip].find} 시험 전이라 제출받았다.`, seat);
      } else {
        log(state, 'check', '휴대 물품을 확인했다. 수험표, 신분증, 컴퓨터용 사인펜뿐이다.' + schemeHint(s, 'pockets', rng), seat);
      }
    }
  }
  maybeAlert(state);
  return true;
}

function schemeHint(s, kind, rng) {
  const h = s.scheme && SCHEMES[s.scheme].precheck && SCHEMES[s.scheme].precheck[kind];
  return h && rng.chance(h[0]) ? ` ${h[1]}` : '';
}

function maybeAlert(state) {
  if (state.alertDone || state.minutes < PRECHECK.alertAt) return;
  state.alertDone = true;
  const saved = state.minutes;
  state.minutes = PRECHECK.alertAt;
  log(state, 'alert', '08:25 위급재난문자 발송.');
  const ringers = state.students.filter((s) => s.slip && SLIPS[s.slip].ring && !s.slipState);
  if (ringers.length) {
    ringers.forEach((s) => {
      s.slipState = 'prevented';
      s.mood = 'nervous';
      log(state, 'prevent', `${s.seat}번 수험생 외투에서 알림음이 크게 울린다. 시험 전이라 휴대폰을 제출받았다. "${SLIPS[s.slip].reaction[0]}"`, s.seat);
    });
  } else {
    log(state, 'system', '교실은 조용하다. 옆 교실 어딘가에서 알림음이 들린다.');
  }
  state.minutes = saved;
}

function finishPrecheck(state) {
  if (state.phase !== 'precheck' || busy(state)) return;
  state.minutes = PRECHECK.minutes;
  maybeAlert(state);
  const rest = state.students.filter((s) => !s.checked.clothes);
  rest.forEach((s) => { s.sticker = true; });
  if (rest.length) log(state, 'system', `부감독관이 나머지 ${rest.length}명의 단추에 스티커만 붙였다. 소매와 주머니는 확인하지 못했다.`);
  state.actionIndex += 1;
  startExam(state);
}

// ---------- 교시 ----------
function startExam(state) {
  const p = PERIODS[state.period];
  state.phase = 'exam';
  state.patrolLeft = BUDGET.patrol;
  state.idLeft = state.period > 0 ? BUDGET.idCheck : 0;
  log(state, 'period', `${p.label} ${p.subject} 시작${state.period === 2 ? ' · 휴대 물품 재점검 날' : ''}`);
  state.schedule[state.period].forEach((ev) => {
    log(state, ev.kind === 'ambient' ? 'ambient' : 'event', ev.text, ev.seat);
    if (ev.kind === 'sticker') {
      student(state, ev.seat).sticker = true;
      log(state, 'action', '다가가서 스티커를 다시 붙였다.', ev.seat);
    }
  });
}

function canIdCheck(state, seat) {
  return state.phase === 'exam' && !busy(state) && state.idLeft > 0 && !!student(state, seat);
}

function idCheck(state, seat) {
  if (!canIdCheck(state, seat)) return false;
  const s = student(state, seat);
  const rng = rngFor(state, 2);
  const p = state.period;
  state.idLeft -= 1;
  state.actionIndex += 1;

  const slip = s.slip ? SLIPS[s.slip] : null;
  if (slip && !s.slipState && slip.sleeve && p <= 2) {
    askSlip(state, s, `본인 확인 중 소매를 걷게 했다. ${slip.find}`);
    return true;
  }
  if (slip && !s.slipState && slip.pocket && p === 2) {
    askSlip(state, s, `3교시 전 휴대 물품 재점검. ${slip.find}`);
    return true;
  }
  const parts = [];
  if (s.scheme === 'proxy' && rng.chance(0.4)) parts.push(rng.pick(PROXY_ID_HINT));
  else parts.push(rng.pick(ID_OK));
  if (s.look.glasses) {
    const swapped = s.scheme === 'aiGlasses' && p > SCHEMES.aiGlasses.swapAfter;
    if (swapped && s.glassesSeenAM) parts.push('그런데 안경이 오전에 본 것과 다르다. 테가 두껍고 다리가 넓다.');
    else if (swapped) parts.push('안경은 두꺼운 검은 테다. 오전에도 이랬는지 기억나지 않는다.');
    else parts.push('안경을 쓴 채로 확인했다. 특이점은 없다.');
  }
  if (p <= 2) parts.push(s.scheme && SCHEMES[s.scheme].idcheck ? SCHEMES[s.scheme].idcheck : '소매 안쪽도 이상 없다.');
  log(state, 'check', `본인 확인: ${parts.join(' ')}`, seat);
  return true;
}

function schemeActive(s, period) {
  if (!s.scheme) return false;
  if (s.scheme === 'aiGlasses') return period > SCHEMES.aiGlasses.swapAfter;
  return true;
}

function canPatrol(state, seat) {
  return state.phase === 'exam' && !busy(state) && state.patrolLeft > 0 && !!student(state, seat);
}

function patrol(state, seat) {
  if (!canPatrol(state, seat)) return false;
  const s = student(state, seat);
  const rng = rngFor(state, 3);
  state.patrolLeft -= 1;
  state.actionIndex += 1;

  const slip = s.slip ? SLIPS[s.slip] : null;
  if (slip && !s.slipState && slip.sleeve && rng.chance(0.7)) {
    askSlip(state, s, `순회 중: ${slip.patrol} 다가가 확인하니 전자시계다.`);
    return true;
  }
  let text;
  if (slip && !s.slipState && slip.pocket && rng.chance(0.6)) text = slip.patrol;
  else if (schemeActive(s, state.period) && rng.chance(0.7)) text = rng.pick(SCHEMES[s.scheme].patrol);
  else if (s.habit && (!s.habitSeen || rng.chance(0.4))) { text = HABITS[s.habit].patrol; s.habitSeen = true; }
  else text = rng.pick(NEUTRAL_PATROL);
  log(state, 'patrol', `순회 중: ${text}`, seat);
  return true;
}

function endExam(state) {
  if (state.phase !== 'exam' || busy(state)) return;
  const p = state.period;
  state.actionIndex += 1;
  state.patrolLeft = 0;
  const s4 = state.students.find((s) => s.slip === 'section4' && !s.slipState);
  if (p === 3 && s4) {
    askSlip(state, s4, fill(SLIPS.section4.event, s4.seat));
    state.phase = 'ending';
    return;
  }
  ringBell(state);
}

function ringBell(state) {
  const p = state.period;
  const bell = state.students.find((s) => s.slip === 'bell' && !s.slipState);
  if (bell && state.bellAt === p) {
    state.phase = 'bell';
    askSlip(state, bell, fill(SLIPS.bell.event, bell.seat));
    return;
  }
  toBreak(state);
}

// 4교시 위반 → 종료령 → 쉬는 시간 순서로 이어 준다.
function continueAfterPending(state) {
  if (state.pending) return;
  if (state.phase === 'ending') ringBell(state);
  else if (state.phase === 'bell') toBreak(state);
}

function toBreak(state) {
  const p = PERIODS[state.period];
  state.afterLeft = BUDGET.afterCheck;
  state.phase = 'break'; // 종료 시각으로 기록
  log(state, 'system', `${p.label} 종료. 답안지를 걷었다.${state.period === 1 ? ' 이제 점심시간이다.' : ''}`);
  state.students.forEach((s) => { if (s.mood === 'nervous') s.mood = 'normal'; });
  // 의심 표시한 수험생이 있을 때만 쉬는 시간 점검 단계를 연다.
  if (suspects(state).length) state.phase = 'break';
  else advance(state);
}

// 의심 표시했고 아직 처리되지 않은 수험생
function suspects(state) {
  return state.students.filter((s) => s.flagged && s.schemeState !== 'caught' && s.slipState !== 'reported');
}

function canAfterCheck(state, seat) {
  return state.phase === 'break' && !busy(state) && state.afterLeft > 0 && !!student(state, seat);
}

// 교시 후 점검: 시험본부에서 금속탐지기와 정밀 점검
function afterCheck(state, seat) {
  if (!canAfterCheck(state, seat)) return false;
  const s = student(state, seat);
  const rng = rngFor(state, 4);
  state.afterLeft -= 1;
  state.actionIndex += 1;

  if (s.scheme && schemeActive(s, state.period) && rng.chance(SCHEMES[s.scheme].detect)) {
    s.schemeState = 'caught';
    s.mood = 'shocked';
    log(state, 'caught', `교시 후 점검: ${SCHEMES[s.scheme].found} ${SCHEMES[s.scheme].caught}`, seat);
    return true;
  }
  const slip = s.slip ? SLIPS[s.slip] : null;
  if (slip && !s.slipState && (slip.pocket || slip.sleeve)) {
    askSlip(state, s, `교시 후 점검: ${slip.find}`);
    return true;
  }
  state.complaints += 1;
  if (s.scheme) {
    const sc = SCHEMES[s.scheme];
    s.mood = 'calm';
    const miss = schemeActive(s, state.period) && sc.missText ? `${sc.missText} ` : '아무것도 나오지 않았다. ';
    log(state, 'clean', `교시 후 점검: ${miss}"${rng.pick(sc.calm)}" 끝까지 침착하다.`, seat);
  } else {
    s.mood = 'angry';
    log(state, 'clean', `교시 후 점검: 아무것도 나오지 않았다. "${rng.pick(PROTEST)}" 민원 1건.`, seat);
  }
  return true;
}

function nextPeriod(state) {
  if (state.phase !== 'break' || busy(state)) return;
  advance(state);
}

function advance(state) {
  state.actionIndex += 1;
  if (state.period < PERIODS.length - 1) {
    state.period += 1;
    startExam(state);
  } else if (suspects(state).length) {
    state.phase = 'report';
    log(state, 'system', '모든 시험이 끝났다. 의심 표시한 수험생은 증거가 없어도 사후 조사를 요청할 수 있다.');
  } else {
    state.phase = 'report';
    submitReport(state);
  }
}

// ---------- 채점 ----------
function submitReport(state) {
  if (state.phase !== 'report') return null;
  let score = 100;
  const tally = { prevented: 0, reported: 0, excused: 0, missedSlip: 0, falseFlags: 0 };
  const schemes = [];
  state.students.forEach((s) => {
    if (s.slip) {
      if (s.slipState === 'prevented') tally.prevented += 1;
      else if (s.slipState === 'reported') tally.reported += 1;
      else if (s.slipState === 'excused') { tally.excused += 1; score -= 15; }
      else { tally.missedSlip += 1; score -= 10; }
    }
    if (s.scheme) {
      if (s.schemeState !== 'caught' && s.flagged) s.schemeState = 'flagged';
      schemes.push({ seat: s.seat, key: s.scheme, state: s.schemeState || 'missed' });
      if (s.schemeState === 'flagged') score -= 15;
      if (!s.schemeState) score -= 35;
    } else if (s.flagged && !s.slip) {
      tally.falseFlags += 1;
      score -= 10;
    }
  });
  score -= state.complaints * 5;
  score = Math.max(0, Math.min(100, score));
  const grade = score >= 90 ? 1 : score >= 80 ? 2 : score >= 70 ? 3 : score >= 60 ? 4 : score >= 50 ? 5 : score >= 40 ? 6 : score >= 30 ? 7 : score >= 20 ? 8 : 9;

  const caught = schemes.filter((x) => x.state === 'caught').length;
  const missed = schemes.filter((x) => x.state === 'missed').length;
  let title;
  if (caught === schemes.length) title = grade <= 2 ? '2년의 준비를 무너뜨린 감독관' : '잡긴 다 잡은 감독관';
  else if (missed === schemes.length) title = '아무 일 없던 시험실… 이었을까?';
  else if (state.complaints + tally.falseFlags >= 4) title = '민원 폭탄 감독관';
  else if (caught > 0) title = '절반만 막은 감독관';
  else title = '촉은 맞았던 감독관';

  state.result = { score, grade, title, schemes, ...tally, complaints: state.complaints };
  state.phase = 'result';
  return state.result;
}

function truth(s) {
  if (s.scheme) return { tag: '계획형', name: SCHEMES[s.scheme].name, text: SCHEMES[s.scheme].reveal };
  if (s.slip) return { tag: '실수형', name: SLIPS[s.slip].name, text: SLIPS[s.slip].reveal };
  return { tag: '무고', name: '', text: s.habit ? '수상해 보인 행동은 그냥 습관이었다.' : '아무 문제 없이 시험을 봤다.' };
}

function outcome(s) {
  if (s.scheme) return { caught: '적발', flagged: '사후 조사로 적발', missed: '놓침' }[s.schemeState || 'missed'];
  if (s.slip) return { prevented: '시험 전 예방', reported: '부정행위 처리', excused: '봐줌' }[s.slipState] || '놓침';
  return s.flagged ? '잘못 의심' : '';
}

// ---- src/pixel.js
// 도트 시험실: 교탁에서 본 12명 (3줄 x 4칸). 이미지 파일 없이 사각형으로 그린다.


const SCENE_W = 240;
const SCENE_H = 204;
const COLS = [36, 92, 148, 204];
const ROWS = [178, 134, 90]; // 책상 윗면 y: 앞줄(1~4), 가운데(5~8), 뒷줄(9~12)

const C = {
  wall: '#c9cbbd', wallDark: '#b4b7a6', locker: '#7f8f86', lockerLine: '#65746c', handle: '#d9dccf',
  board: '#9b7a52', note: '#efe9d6', noteB: '#cfe0ea', noteC: '#f2d27a',
  floor: '#8c6c4c', floorLine: '#7a5b3e',
  deskTop: '#c79a68', deskFront: '#a27850', deskEdge: '#7d5a37', metal: '#596066',
  paper: '#f6f6f1', omr: '#e0607d', ink: '#1a1d1f', plate: '#eef0ea',
  sticker: '#fff3a6', sweat: '#8fd0ff', tear: '#6fb8ff', blush: '#e98a8a',
  select: '#ffd84a', flag: '#ffd84a', red: '#ff5a5a', orange: '#ff9f43', green: '#5fd38d',
};

const DIGITS = {
  0: ['111', '101', '101', '101', '111'], 1: ['010', '110', '010', '010', '111'],
  2: ['111', '001', '111', '100', '111'], 3: ['111', '001', '111', '001', '111'],
  4: ['101', '101', '111', '001', '001'], 5: ['111', '100', '111', '001', '111'],
  6: ['111', '100', '111', '101', '111'], 7: ['111', '001', '010', '010', '010'],
  8: ['111', '101', '111', '101', '111'], 9: ['111', '101', '111', '001', '111'],
};

function px(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function digits(ctx, str, x, y, color) {
  let cx = x;
  for (const ch of str) {
    const g = DIGITS[ch];
    g.forEach((row, ry) => [...row].forEach((b, rx) => { if (b === '1') px(ctx, cx + rx, y + ry, 1, 1, color); }));
    cx += 4;
  }
}

function seatPos(seat) {
  const row = Math.floor((seat - 1) / 4);
  const col = (seat - 1) % 4;
  return { x: COLS[col], desk: ROWS[row], row };
}

function drawRoom(ctx, state) {
  px(ctx, 0, 0, SCENE_W, 60, C.wall);
  // 게시판과 공지
  px(ctx, 14, 6, 150, 20, C.board);
  [[18, 9, C.note], [34, 8, C.noteB], [52, 10, C.note], [70, 8, C.noteC], [92, 9, C.note], [110, 8, C.noteB], [130, 10, C.note], [146, 8, C.noteC]]
    .forEach(([x, y, c]) => px(ctx, x, y, 12, 14, c));
  // 시계
  const [h, m] = clock(state);
  px(ctx, 196, 4, 24, 24, C.ink);
  px(ctx, 198, 6, 20, 20, C.plate);
  const cx = 208, cy = 16;
  const ha = (((h % 12) + m / 60) / 12) * Math.PI * 2;
  const ma = (m / 60) * Math.PI * 2;
  for (let r = 0; r <= 5; r++) px(ctx, cx + Math.round(Math.sin(ha) * r), cy - Math.round(Math.cos(ha) * r), 1, 1, C.ink);
  for (let r = 0; r <= 8; r++) px(ctx, cx + Math.round(Math.sin(ma) * r), cy - Math.round(Math.cos(ma) * r), 1, 1, C.red);
  // 사물함
  px(ctx, 0, 32, SCENE_W, 28, C.locker);
  for (let x = 0; x < SCENE_W; x += 20) {
    px(ctx, x, 32, 1, 28, C.lockerLine);
    px(ctx, x + 15, 44, 2, 4, C.handle);
  }
  px(ctx, 0, 45, SCENE_W, 1, C.lockerLine);
  // 바닥
  px(ctx, 0, 60, SCENE_W, SCENE_H - 60, C.floor);
  for (let y = 66; y < SCENE_H; y += 9) px(ctx, 0, y, SCENE_W, 1, C.floorLine);
}

function hair(ctx, x, y, look, back) {
  const c = look.hair;
  switch (look.hairStyle) {
    case 'buzz': if (!back) px(ctx, x - 5, y - 1, 10, 2, c); break;
    case 'long':
      if (back) px(ctx, x - 6, y, 12, 14, c);
      else { px(ctx, x - 5, y - 1, 10, 4, c); px(ctx, x - 6, y + 1, 2, 9, c); px(ctx, x + 4, y + 1, 2, 9, c); }
      break;
    case 'ponytail':
      if (back) px(ctx, x + 4, y + 2, 3, 8, c);
      else { px(ctx, x - 5, y - 1, 10, 4, c); px(ctx, x - 6, y + 1, 1, 4, c); px(ctx, x + 5, y + 1, 1, 4, c); }
      break;
    case 'bob':
      if (!back) { px(ctx, x - 6, y - 1, 12, 4, c); px(ctx, x - 6, y + 3, 2, 5, c); px(ctx, x + 4, y + 3, 2, 5, c); }
      break;
    case 'fluffy':
      if (!back) { px(ctx, x - 6, y - 2, 12, 5, c); px(ctx, x - 4, y - 3, 3, 1, c); px(ctx, x + 1, y - 3, 3, 1, c); }
      break;
    default:
      if (!back) { px(ctx, x - 5, y - 1, 10, 4, c); px(ctx, x - 5, y + 3, 1, 2, c); px(ctx, x + 4, y + 3, 1, 2, c); }
  }
}

function face(ctx, x, y, s, blink, thickGlasses) {
  const ey = y + 5;
  const mood = s.mood;
  if (mood === 'shocked') {
    px(ctx, x - 3, ey - 1, 2, 2, C.ink); px(ctx, x + 2, ey - 1, 2, 2, C.ink); px(ctx, x - 1, y + 8, 2, 2, C.ink);
  } else {
    if (blink || mood === 'crying') { px(ctx, x - 3, ey, 2, 1, C.ink); px(ctx, x + 2, ey, 2, 1, C.ink); }
    else { px(ctx, x - 3, ey - 1, 1, 2, C.ink); px(ctx, x + 2, ey - 1, 1, 2, C.ink); }
    if (mood === 'angry') { px(ctx, x - 4, ey - 3, 2, 1, C.ink); px(ctx, x + 3, ey - 3, 2, 1, C.ink); px(ctx, x - 1, y + 9, 3, 1, C.ink); }
    else if (mood === 'calm') { px(ctx, x - 2, y + 8, 1, 1, C.ink); px(ctx, x - 1, y + 9, 3, 1, C.ink); px(ctx, x + 2, y + 8, 1, 1, C.ink); }
    else if (mood === 'nervous') { px(ctx, x - 2, y + 9, 1, 1, C.ink); px(ctx, x - 1, y + 8, 1, 1, C.ink); px(ctx, x, y + 9, 1, 1, C.ink); px(ctx, x + 1, y + 8, 1, 1, C.ink); }
    else px(ctx, x - 1, y + 9, 3, 1, C.ink);
    if (mood === 'crying') { px(ctx, x - 3, ey + 1, 1, 3, C.tear); px(ctx, x + 3, ey + 1, 1, 3, C.tear); }
    if (mood === 'angry') { px(ctx, x - 5, y + 7, 1, 1, C.blush); px(ctx, x + 5, y + 7, 1, 1, C.blush); }
  }
  if (s.look.glasses) {
    const t = thickGlasses ? 2 : 1;
    px(ctx, x - 5, ey - 2, 5, t, C.ink); px(ctx, x + 1, ey - 2, 5, t, C.ink);
    px(ctx, x - 5, ey + 1, 5, 1, C.ink); px(ctx, x + 1, ey + 1, 5, 1, C.ink);
    px(ctx, x - 5, ey - 2, t, 4, C.ink); px(ctx, x + 5 - (t - 1), ey - 2, t, 4, C.ink);
    px(ctx, x, ey - 1, 1, 1, C.ink);
    if (thickGlasses) { px(ctx, x - 7, ey - 1, 2, 2, C.ink); px(ctx, x + 6, ey - 1, 2, 2, C.ink); }
  }
}

function drawStudent(ctx, state, s, o) {
  const { x, desk } = seatPos(s.seat);
  const t = o.t;
  const off = s.seat * 977;
  const blink = (t + off * 3) % 4100 < 140;
  const bob = !o.reduceMotion && (t + off) % 2900 < 160 ? 1 : 0;
  const headY = desk - 23 + bob;
  const cl = s.look.clothes;
  const thick = s.scheme === 'aiGlasses' && state.period > SCHEMES.aiGlasses.swapAfter && !['precheck'].includes(state.phase);

  // 몸
  px(ctx, x - 7, desk - 11, 14, 11, cl.body);
  if (cl.kind === 'uniform') { px(ctx, x - 2, desk - 11, 4, 3, cl.trim); }
  else if (cl.kind === 'hoodie') { px(ctx, x - 4, desk - 11, 8, 2, cl.trim); }
  else if (cl.kind === 'shirt') { px(ctx, x - 1, desk - 11, 2, 1, cl.trim); px(ctx, x, desk - 10, 1, 9, cl.trim); }
  else { px(ctx, x - 7, desk - 7, 14, 1, cl.trim); }
  if (s.sticker) { px(ctx, x - 1, desk - 8, 2, 2, C.sticker); px(ctx, x - 1, desk - 4, 2, 2, C.sticker); }
  // 머리
  hair(ctx, x, headY, s.look, true);
  px(ctx, x - 4, headY, 8, 11, s.look.skin);
  px(ctx, x - 5, headY + 2, 1, 6, s.look.skin);
  px(ctx, x + 4, headY + 2, 1, 6, s.look.skin);
  hair(ctx, x, headY, s.look, false);
  face(ctx, x, headY, s, blink, thick);
  if (s.mood === 'nervous' || s.mood === 'shocked') { px(ctx, x + 6, headY + 1, 1, 1, C.sweat); px(ctx, x + 5, headY + 2, 3, 2, C.sweat); }

  // 책상
  px(ctx, x - 18, desk, 36, 4, C.deskTop);
  px(ctx, x - 10, desk - 1, 12, 2, C.paper);
  px(ctx, x + 4, desk - 1, 7, 2, C.omr);
  px(ctx, x - 9, desk - 1, 3, 2, s.look.skin);
  px(ctx, x + 6, desk - 1, 3, 2, s.look.skin);
  px(ctx, x - 18, desk + 4, 36, 1, C.deskEdge);
  px(ctx, x - 17, desk + 5, 34, 11, C.deskFront);
  px(ctx, x - 16, desk + 16, 2, 8, C.metal);
  px(ctx, x + 14, desk + 16, 2, 8, C.metal);
  const label = String(s.seat);
  const w = label.length * 4 + 3;
  px(ctx, x - Math.floor(w / 2), desk + 6, w, 8, C.plate);
  digits(ctx, label, x - Math.floor(w / 2) + 2, desk + 7, C.ink);

  // 표시
  const top = headY - 9;
  if (o.phase === 'result') {
    const c = s.scheme ? C.red : s.slip ? C.orange : null;
    if (c) { px(ctx, x - 3, top - 1, 7, 7, c); px(ctx, x, top, 1, 3, C.plate); px(ctx, x, top + 4, 1, 1, C.plate); }
  } else {
    if (s.flagged) { px(ctx, x + 7, headY - 2, 5, 7, C.flag); px(ctx, x + 9, headY - 1, 1, 3, C.ink); px(ctx, x + 9, headY + 3, 1, 1, C.ink); }
    if (o.selected === s.seat) {
      const up = o.reduceMotion ? 0 : Math.floor(t / 300) % 2;
      px(ctx, x - 3, top - up, 7, 1, C.select); px(ctx, x - 2, top + 1 - up, 5, 1, C.select);
      px(ctx, x - 1, top + 2 - up, 3, 1, C.select); px(ctx, x, top + 3 - up, 1, 1, C.select);
    }
  }
}

function drawScene(ctx, state, opts = {}) {
  const o = { t: 0, selected: null, reduceMotion: false, ...opts, phase: state.phase };
  ctx.imageSmoothingEnabled = false;
  drawRoom(ctx, state);
  // 뒷줄부터 그려서 앞줄이 위에 오게
  [2, 1, 0].forEach((row) => {
    state.students.filter((s) => Math.floor((s.seat - 1) / 4) === row).forEach((s) => drawStudent(ctx, state, s, o));
  });
}

function seatAt(x, y) {
  for (const row of [0, 1, 2]) {
    for (let col = 0; col < 4; col++) {
      const seat = row * 4 + col + 1;
      const { x: sx, desk } = seatPos(seat);
      if (Math.abs(x - sx) <= 24 && y >= desk - 34 && y <= desk + 16) return seat;
    }
  }
  return null;
}

// ---- src/card.js
// 결과 공유 카드(1080x1350)


const W = 1080;
const H = 1350;
const K = { page: '#1b1f27', box: '#0d1015', line: '#f2efe6', text: '#f4f1e8', dim: '#a9b1bb', yellow: '#ffd84a', shadow: '#6b4f00', red: '#ff6b6b', green: '#69db7c' };
const FONT = '"Galmuri11", "Apple SD Gothic Neo", monospace';

function box(ctx, x, y, w, h) {
  ctx.fillStyle = K.box;
  ctx.fillRect(x - 9, y - 9, w + 18, h + 18);
  ctx.fillStyle = K.line;
  ctx.fillRect(x - 6, y - 6, w + 12, h + 12);
  ctx.fillStyle = K.box;
  ctx.fillRect(x, y, w, h);
}

function text(ctx, str, x, y, size, color, weight = 400) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  return ctx.measureText(str).width;
}

function renderCard(state) {
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  const r = state.result;
  ctx.textBaseline = 'top';
  ctx.fillStyle = K.page;
  ctx.fillRect(0, 0, W, H);

  // 장면
  const scene = document.createElement('canvas');
  scene.width = SCENE_W;
  scene.height = SCENE_H;
  drawScene(scene.getContext('2d'), state, { reduceMotion: true });
  const sw = SCENE_W * 3;
  const sh = SCENE_H * 3;
  const sx = (W - sw) / 2;
  box(ctx, sx, 60, sw, sh);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(scene, sx, 60, sw, sh);

  // 등급 상자
  const by = 60 + sh + 48;
  const tx = 60;
  box(ctx, tx, by, W - 120, H - by - 60);
  let y = by + 36;
  text(ctx, `수능 감독관 · 시험실 ${state.room}`, tx + 40, y, 33, K.dim);
  y += 64;
  const g = String(r.grade);
  text(ctx, g, tx + 44, y + 6, 132, K.shadow, 700);
  const gw = text(ctx, g, tx + 40, y, 132, K.yellow, 700);
  text(ctx, '등급', tx + 56 + gw, y + 70, 55, K.text, 700);
  y += 160;
  text(ctx, r.title, tx + 40, y, 44, K.yellow, 700);
  y += 76;

  r.schemes.forEach((sc) => {
    const name = SCHEMES[sc.key].name;
    const line = sc.state === 'caught' ? `${sc.seat}번 ${name} 적발` : sc.state === 'flagged' ? `${sc.seat}번 ${name} 사후 조사` : `${sc.seat}번 ${name} 놓침`;
    text(ctx, line, tx + 40, y, 34, sc.state === 'missed' ? K.red : K.green);
    y += 50;
  });
  y += 8;
  text(ctx, `예방 ${r.prevented} · 처리 ${r.reported} · 봐줌 ${r.excused} · 놓침 ${r.missedSlip} · 민원 ${r.complaints}`, tx + 40, y, 30, K.dim);
  return canvas;
}

// ---- src/main.js
// 화면 연결




const $ = (id) => document.getElementById(id);
const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const sceneCtx = $('scene').getContext('2d');

let state = null;
let selected = null;
let dialogFrom = 0;
let cardBlob = null;

// ---------- 시작/화면 전환 ----------
function roomFromHash() {
  const m = /room-(\d{4})/.exec(location.hash || '');
  return m ? normalizeRoom(m[1]) : null;
}

function setHash(room) {
  try { history.replaceState(null, '', `#room-${room}`); } catch (e) { /* 무시 */ }
}

function start(room) {
  state = newGame(room);
  selected = null;
  dialogFrom = 0;
  setHash(room);
  showScreen('game');
  render();
  window.scrollTo(0, 0);
}

function showScreen(name) {
  ['title', 'game', 'result'].forEach((id) => { $(id).hidden = id !== name; });
}

// ---------- 렌더링 ----------
function phaseName() {
  const p = PERIODS[state.period];
  switch (state.phase) {
    case 'precheck': return '입실 점검';
    case 'exam': return `${p.label} ${p.subject}`;
    case 'ending': case 'bell': case 'break': return `${p.label} 종료`;
    case 'report': return '감독 보고서';
    default: return '';
  }
}

function budgetText() {
  switch (state.phase) {
    case 'precheck': return `남은 시간 ${PRECHECK.minutes - state.minutes}분`;
    case 'exam': return state.period > 0 ? `본인 확인 ${state.idLeft} · 순회 ${state.patrolLeft}` : `순회 ${state.patrolLeft}`;
    case 'break': return '쉬는 시간';
    default: return '';
  }
}

function render() {
  if (!state) return;
  if (state.phase === 'result') { renderResult(); return; }
  $('hud-time').textContent = clockText(state);
  $('hud-phase').textContent = phaseName();
  $('hud-budget').textContent = budgetText();
  const comp = $('hud-complaints');
  comp.textContent = `민원 ${state.complaints}`;
  comp.className = state.complaints >= 3 ? 'warn' : '';
  renderSeats();
  renderDialog();
  renderMenu();
  renderNotes();
  renderLog();
  drawNow();
}

function renderSeats() {
  const grid = $('seat-grid');
  grid.innerHTML = '';
  state.students.forEach((s) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s.seat;
    b.setAttribute('aria-pressed', String(selected === s.seat));
    b.setAttribute('aria-label', `${label(s)}${s.flagged ? ', 의심 표시됨' : ''}`);
    if (s.flagged) b.classList.add('flagged');
    if (s.slipState === 'reported' || s.schemeState === 'caught') b.classList.add('out');
    b.addEventListener('click', () => select(s.seat));
    grid.appendChild(b);
  });
}

function entryHtml(e, withWho = true) {
  const who = withWho && e.seat ? `<span class="who">${e.seat}번</span>` : '';
  return `<span class="t">${e.time}</span>${who}<span class="k-${e.kind}">${esc(e.text)}</span>`;
}

function renderDialog() {
  const box = $('dialog');
  const fresh = state.log.slice(dialogFrom);
  let html = fresh.map((e) => `<p>${entryHtml(e)}</p>`).join('');
  if (state.pending) html += '<p><b>어떻게 처리할까?</b></p>';
  else if (state.phase === 'report') {
    const flagged = state.students.filter((s) => s.flagged && s.schemeState !== 'caught' && s.slipState !== 'reported');
    html += `<p>${flagged.length ? `사후 조사 요청 대상: <b>${flagged.map((s) => `${s.seat}번`).join(', ')}</b>` : '사후 조사를 요청할 수험생이 없다.'}</p><p class="dim">의심 표시를 바꾸려면 수험생을 고르고 의심 표시를 누른다.</p>`;
  } else if (!fresh.length) html = `<p class="dim">${hint()}</p>`;
  box.innerHTML = html;
}

function hint() {
  switch (state.phase) {
    case 'precheck': return '수험생을 눌러 점검을 시작하세요.';
    case 'exam': return state.period > 0 ? '본인 확인하거나 가까이 살펴볼 수험생을 고르세요.' : '가까이 살펴볼 수험생을 고르세요. 수상하면 의심 표시를 해 두세요.';
    case 'break': return '의심 표시한 수험생을 시험본부에서 정밀 점검할 수 있다. 쉬는 시간마다 1명.';
    default: return '';
  }
}

function item(menu, text, onClick, opts = {}) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'item' + (opts.cls ? ` ${opts.cls}` : '');
  b.innerHTML = `<span>${esc(text)}</span>${opts.cost ? `<span class="cost">${esc(opts.cost)}</span>` : ''}`;
  b.disabled = !!opts.disabled;
  b.addEventListener('click', onClick);
  menu.appendChild(b);
  return b;
}

function sep(menu) {
  const d = document.createElement('div');
  d.className = 'sep';
  menu.appendChild(d);
}

function menuLabel(menu, text) {
  const d = document.createElement('div');
  d.className = 'menu-label';
  d.textContent = text;
  menu.appendChild(d);
}

function renderMenu() {
  const menu = $('menu');
  menu.innerHTML = '';
  if (state.pending) {
    item(menu, '부정행위로 처리한다', () => act(() => resolvePending(state, 'report')), { cls: 'danger' });
    item(menu, '주의만 주고 넘어간다', () => act(() => resolvePending(state, 'excuse')));
    return;
  }
  const s = selected ? student(state, selected) : null;
  if (state.phase !== 'break') {
    if (s) menuLabel(menu, `${label(s)}${s.look.glasses ? ' · 안경' : ''}`);
    else menuLabel(menu, '수험생을 고르지 않았다');
  }

  const flagItem = () => {
    if (s) item(menu, s.flagged ? '의심 표시 지우기' : '의심 표시하기', () => { toggleFlag(state, s.seat); render(); }, { cost: '무료' });
  };

  if (state.phase === 'precheck') {
    if (s) {
      const done = (k) => (s.checked[k] ? '완료' : `${PRECHECK.cost[k]}분`);
      item(menu, '본인 확인 (사진 대조)', () => act(() => precheck(state, 'id', s.seat)), { cost: done('id'), disabled: !canPrecheck(state, 'id', s.seat) });
      item(menu, '소매·옷깃 확인, 단추 스티커', () => act(() => precheck(state, 'clothes', s.seat)), { cost: done('clothes'), disabled: !canPrecheck(state, 'clothes', s.seat) });
      if (s.look.glasses) item(menu, '안경 벗겨서 검사', () => act(() => precheck(state, 'glasses', s.seat)), { cost: done('glasses'), disabled: !canPrecheck(state, 'glasses', s.seat) });
      item(menu, '휴대 물품 확인', () => act(() => precheck(state, 'pockets', s.seat)), { cost: done('pockets'), disabled: !canPrecheck(state, 'pockets', s.seat) });
      flagItem();
    }
    sep(menu);
    item(menu, '전자기기 제출 최종 안내', () => act(() => precheck(state, 'announce')), { cost: state.announced ? '완료' : '1분', disabled: !canPrecheck(state, 'announce') });
    item(menu, '점검 마치고 1교시 시작', () => act(() => finishPrecheck(state)), { cls: 'main' });
  } else if (state.phase === 'exam') {
    if (s) {
      if (state.period > 0) item(menu, '본인 확인 (사진·안경·소매)', () => act(() => idCheck(state, s.seat)), { cost: `${state.idLeft}회 남음`, disabled: !canIdCheck(state, s.seat) });
      item(menu, '가까이 지나가며 보기', () => act(() => patrol(state, s.seat)), { cost: `${state.patrolLeft}회 남음`, disabled: !canPatrol(state, s.seat) });
      flagItem();
    }
    sep(menu);
    item(menu, `${PERIODS[state.period].label} 종료까지 감독`, () => act(() => endExam(state)), { cls: 'main' });
  } else if (state.phase === 'break') {
    menuLabel(menu, '시험본부 정밀 점검 (금속탐지기)');
    suspects(state).forEach((x) => {
      item(menu, `${label(x)} 점검`, () => act(() => afterCheck(state, x.seat)), { cost: `${state.afterLeft}회`, disabled: !canAfterCheck(state, x.seat) });
    });
    sep(menu);
    const last = state.period === PERIODS.length - 1;
    item(menu, last ? '감독 보고서 쓰기' : `${PERIODS[state.period + 1].label}로`, () => act(() => nextPeriod(state)), { cls: 'main' });
  } else if (state.phase === 'report') {
    if (s) flagItem();
    sep(menu);
    item(menu, '보고서 제출', () => act(() => submitReport(state)), { cls: 'main' });
  }
}

function renderNotes() {
  const box = $('notes');
  if (!selected) { box.hidden = true; return; }
  const s = student(state, selected);
  const notes = state.log.filter((e) => e.seat === selected);
  box.hidden = false;
  $('notes-title').textContent = `수첩 · ${label(s)}`;
  $('notes-list').innerHTML = notes.length
    ? notes.map((e) => `<li>${entryHtml(e, false)}</li>`).join('')
    : '<li class="dim">아직 적은 게 없다.</li>';
}

function renderLog() {
  $('log').innerHTML = state.log.map((e) => `<li>${entryHtml(e)}</li>`).join('');
}

function renderResult() {
  showScreen('result');
  const r = state.result;
  $('r-room').textContent = state.room;
  $('r-grade').textContent = r.grade;
  $('r-title').textContent = r.title;
  $('r-stats').textContent = `점수 ${r.score} · 예방 ${r.prevented} · 처리 ${r.reported} · 봐줌 ${r.excused} · 놓침 ${r.missedSlip} · 민원 ${r.complaints}`;
  $('r-truth').innerHTML = state.students.map((s) => {
    const t = truth(s);
    const cls = s.scheme ? 'scheme' : s.slip ? 'slip' : 'clean';
    const out = outcome(s);
    return `<li><span class="no">${s.seat}번</span><div><span class="tag ${cls}">${t.tag}${t.name ? ` · ${esc(t.name)}` : ''}</span>${esc(s.name)}${out ? `<span class="out">${esc(out)}</span>` : ''}<p>${esc(t.text)}</p></div></li>`;
  }).join('');
  const rc = $('result-scene').getContext('2d');
  drawScene(rc, state, { t: 0, reduceMotion: true });
  window.scrollTo(0, 0);
}

function esc(str) {
  return String(str).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ---------- 입력 ----------
function select(seat) {
  selected = selected === seat ? null : seat;
  render();
}

function act(fn) {
  dialogFrom = state.log.length;
  fn();
  render();
  if (state.phase !== 'result') $('dialog').scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
}

$('scene').addEventListener('click', (ev) => {
  if (!state) return;
  const rect = ev.currentTarget.getBoundingClientRect();
  const seat = seatAt(((ev.clientX - rect.left) / rect.width) * SCENE_W, ((ev.clientY - rect.top) / rect.height) * SCENE_H);
  if (seat) select(seat);
});

$('start-btn').addEventListener('click', () => start(normalizeRoom($('room-input').value) || randomRoom()));
$('room-input').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') $('start-btn').click(); });
$('how-btn').addEventListener('click', (ev) => {
  const how = $('how');
  how.hidden = !how.hidden;
  ev.currentTarget.setAttribute('aria-expanded', String(!how.hidden));
});
$('btn-retry').addEventListener('click', () => start(state.room));
$('btn-new').addEventListener('click', () => start(randomRoom()));
$('btn-copy').addEventListener('click', async (ev) => {
  const btn = ev.currentTarget;
  try { await navigator.clipboard.writeText(String(state.room)); btn.textContent = `복사됨 · ${state.room}`; }
  catch (e) { btn.textContent = `시험실 번호 ${state.room}`; }
});
$('btn-card').addEventListener('click', async () => {
  try { await document.fonts.load('20px "Galmuri11"'); await document.fonts.load('700 20px "Galmuri11"'); } catch (e) { /* 기본 글꼴로 그린다 */ }
  const canvas = renderCard(state);
  $('card-img').src = canvas.toDataURL('image/png');
  cardBlob = null;
  canvas.toBlob((b) => { cardBlob = b; });
  $('card-overlay').hidden = false;
});
$('btn-close-card').addEventListener('click', () => { $('card-overlay').hidden = true; });
$('btn-share').addEventListener('click', async (ev) => {
  const btn = ev.currentTarget;
  const text = `수능 감독관 ${state.result.grade}등급 · ${state.result.title}. 시험실 ${state.room}에서 붙어 보자.`;
  try {
    const file = cardBlob ? new File([cardBlob], `suneung-${state.room}.png`, { type: 'image/png' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
    if (navigator.share) { await navigator.share({ text }); return; }
    throw new Error('no share');
  } catch (e) {
    btn.textContent = '이미지를 길게 눌러 저장하세요';
  }
});

// ---------- 그리기 ----------
let lastDraw = 0;
function drawNow(t = performance.now()) {
  if (state && state.phase !== 'result') drawScene(sceneCtx, state, { t, selected, reduceMotion });
}
function frame(t) {
  if (state && !$('game').hidden && t - lastDraw > 90) { lastDraw = t; drawNow(t); }
  requestAnimationFrame(frame);
}

// ---------- 부팅 ----------
function boot(data) {
  if (data && data.state && data.state.v === 2) {
    state = data.state;
    selected = data.selected || null;
    dialogFrom = data.dialogFrom || 0;
    showScreen(state.phase === 'result' ? 'result' : 'game');
    render();
  } else {
    showScreen('title');
    const r = roomFromHash();
    if (r) $('room-input').value = String(r);
  }
  requestAnimationFrame(frame);
}

const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ state, selected, dialogFrom }));
if (hot && hot.ready) hot.ready(boot);
else boot(hot && hot.data ? hot.data : {});

})();
</script>
