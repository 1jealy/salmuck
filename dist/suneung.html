:root {
  --page: #1b1f27;
  --box: #0d1015;
  --line: #f2efe6;
  --text: #f4f1e8;
  --dim: #a9b1bb;
  --yellow: #ffd84a;
  --red: #ff6b6b;
  --orange: #ffa94d;
  --green: #69db7c;
  --font: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  color-scheme: dark;
}

html, body { height: auto; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.75;
  word-break: keep-all;
  overflow-wrap: anywhere;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
  -webkit-font-smoothing: none;
}

[hidden] { display: none !important; }

.app { max-width: 520px; margin: 0 auto; }
.screen { display: flex; flex-direction: column; gap: 14px; }

.box {
  background: var(--box);
  border: 3px solid var(--line);
  box-shadow: 0 0 0 3px var(--box);
  padding: 14px 16px;
  margin: 3px;
}
.dim { color: var(--dim); }
b { color: var(--yellow); font-weight: 700; }

/* 시작 화면 */
.intro { display: flex; flex-direction: column; gap: 10px; }
.intro p { margin: 0; }
.intro h1 {
  margin: 4px 0;
  font-size: 44px;
  line-height: 1.2;
  font-weight: 700;
  color: var(--yellow);
  text-shadow: 3px 3px 0 #6b4f00;
}
.field { display: block; margin-bottom: 6px; }
input {
  font: inherit;
  font-size: 24px;
  letter-spacing: 0.15em;
  width: 100%;
  max-width: 240px;
  box-sizing: border-box;
  padding: 8px 10px;
  background: #000;
  color: var(--text);
  border: 3px solid var(--dim);
  border-radius: 0;
  margin-bottom: 10px;
}
input:focus-visible { outline: none; border-color: var(--yellow); }
input::placeholder { color: #6c737c; font-size: 17px; letter-spacing: 0; }
.rules p { margin: 0 0 10px; }
.rules p:last-child { margin-bottom: 0; }

/* 메뉴(선택지) */
.menu { display: flex; flex-direction: column; gap: 2px; }
.menu .item {
  font: inherit;
  font-size: 18px;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 48px;
  padding: 6px 8px 6px 30px;
  background: transparent;
  color: var(--text);
  border: 0;
  cursor: pointer;
  position: relative;
}
.menu .item::before { content: "▶"; position: absolute; left: 6px; color: transparent; }
.menu .item:hover:not(:disabled)::before,
.menu .item:focus-visible::before { color: var(--yellow); }
.menu .item:hover:not(:disabled), .menu .item:focus-visible { background: #1f2530; outline: none; }
.menu .item:disabled { color: #5d646e; cursor: not-allowed; }
.menu .item .cost { color: var(--dim); font-size: 15px; white-space: nowrap; }
.menu .item.main { color: var(--yellow); }
.menu .item.danger { color: var(--red); }
.menu .sep { height: 2px; background: #2c333e; margin: 6px 0; }
.menu .menu-label { color: var(--dim); font-size: 15px; padding: 2px 8px; }

/* HUD */
.hud {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  align-items: baseline;
  padding: 8px 14px;
  font-size: 16px;
}
.hud .time { font-size: 22px; color: var(--yellow); }
.hud .warn { color: var(--red); }

/* 장면 */
#scene, #result-scene {
  display: block;
  width: 100%;
  max-width: 100%;
  aspect-ratio: 240 / 204;
  image-rendering: pixelated;
  border: 3px solid var(--line);
  box-shadow: 0 0 0 3px var(--box);
  margin: 3px;
  width: calc(100% - 6px);
  box-sizing: border-box;
  touch-action: manipulation;
  cursor: pointer;
}
#result-scene { cursor: default; }

/* 좌석 버튼 */
.seat-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.seat-grid button {
  font: inherit;
  font-size: 17px;
  min-height: 44px;
  background: var(--box);
  color: var(--text);
  border: 2px solid #4a525e;
  border-radius: 0;
  cursor: pointer;
  position: relative;
  padding: 0;
}
.seat-grid button[aria-pressed="true"] { border-color: var(--yellow); color: var(--yellow); background: #2a2410; }
.seat-grid button.flagged::after { content: "!"; position: absolute; top: 0; right: 4px; color: var(--yellow); font-size: 14px; }
.seat-grid button.out { color: #5d646e; text-decoration: line-through; }
.seat-grid button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 1px; }

/* 대화창 */
.dialog { min-height: 112px; font-size: 18px; }
.dialog p { margin: 0 0 10px; }
.dialog p:last-child { margin-bottom: 0; }
.dialog .who { color: var(--yellow); margin-right: 6px; }
.dialog .t { color: var(--dim); font-size: 15px; margin-right: 8px; }
.k-found, .k-caught { color: var(--red); }
.k-prevent { color: var(--green); }
.k-alert { color: var(--orange); }
.k-period { color: var(--yellow); }
.k-ambient { color: var(--dim); }

/* 수첩 */
.notes h2, .box h2 { margin: 0 0 8px; font-size: 18px; color: var(--yellow); font-weight: 700; }
.notes ol, .log ol, .truth { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.notes li, .log li { font-size: 16px; }
.notes .t, .log .t { color: var(--dim); font-size: 14px; margin-right: 8px; }
.log summary { cursor: pointer; font-size: 17px; color: var(--dim); }
.log[open] summary { margin-bottom: 10px; color: var(--yellow); }

/* 결과 */
.result-head p { margin: 0; }
.grade { font-size: 30px; color: var(--text); }
.grade span { font-size: 72px; color: var(--yellow); line-height: 1.1; margin-right: 4px; text-shadow: 4px 4px 0 #6b4f00; }
.r-title { font-size: 22px; color: var(--yellow); margin-top: 4px !important; }
.truth li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; font-size: 16px; }
.truth .no { font-size: 18px; color: var(--dim); }
.truth .tag { display: inline-block; margin-right: 6px; }
.truth .tag.scheme { color: var(--red); }
.truth .tag.slip { color: var(--orange); }
.truth .tag.clean { color: var(--green); }
.truth .out { display: block; color: var(--yellow); }
.truth p { margin: 2px 0 0; color: var(--dim); }

/* 카드 */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(5, 7, 10, 0.92);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.overlay-inner { max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 10px; }
.overlay-inner img { width: 100%; height: auto; display: block; image-rendering: pixelated; }

/* 확대 그림 보기 */
.viewer { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; }
.viewer-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
#v-title { color: var(--yellow); font-size: 19px; }
#closeup {
  display: block;
  margin: 0 auto;
  max-width: 100%;
  width: 100%;
  aspect-ratio: 160 / 120;
  image-rendering: pixelated;
  background: #000;
}
.v-caption { margin: 0; min-height: 1.6em; font-size: 17px; }
.v-caption.k-found, .v-caption.k-caught { color: var(--red); }
.v-caption.k-clean { color: var(--orange); }
.v-caption.k-prevent { color: var(--green); }

/* 행동 버튼 */
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.act {
  font: inherit;
  font-size: 17px;
  min-height: 56px;
  padding: 8px 10px;
  background: var(--box);
  color: var(--text);
  border: 3px solid var(--line);
  border-radius: 0;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  text-align: left;
  line-height: 1.3;
}
.act small { color: var(--dim); font-size: 14px; }
.act:hover:not(:disabled), .act:focus-visible { background: #1f2530; outline: none; border-color: var(--yellow); }
.act:disabled { color: #5d646e; border-color: #3a414b; cursor: not-allowed; }
.act.main { grid-column: 1 / -1; color: var(--yellow); align-items: center; }
.act.danger { color: var(--red); }
.act.flag[aria-pressed="true"] { color: var(--yellow); border-color: var(--yellow); }

/* 수첩 앨범 */
.album-box { padding: 10px 12px; }
.small { margin: 0 0 8px; font-size: 14px; }
.album { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.shot { flex: 0 0 auto; background: none; border: 2px solid #4a525e; padding: 0; cursor: pointer; color: var(--dim); font: inherit; font-size: 13px; }
.shot canvas { display: block; width: 104px; height: 78px; image-rendering: pixelated; }
.shot span { display: block; padding: 2px 4px; text-align: left; }
.shot[aria-current="true"] { border-color: var(--yellow); color: var(--yellow); }
.shot:focus-visible { outline: 2px solid var(--yellow); }

/* 이번 교시 */
.ticker { padding: 10px 12px; }
.ticker ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 16px; }
.ticker .t { color: var(--dim); font-size: 14px; margin-right: 8px; }

/* 결과 화면의 증거 그림 */
.truth canvas { display: block; width: 100%; max-width: 240px; aspect-ratio: 160 / 120; image-rendering: pixelated; margin-top: 6px; border: 2px solid #4a525e; }

/* 확대 창 (그림 밖) */
.insets { display: flex; flex-wrap: wrap; gap: 10px; }
.insets figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.insets canvas { image-rendering: pixelated; border: 2px solid var(--line); background: #000; }
.insets figcaption { font-size: 14px; color: var(--dim); }

</style>

// 단추는 옷 종류마다 따로. 후드·패딩에는 단추가 없다(지퍼).
const BUTTONS = {
  uniform: [[81, 83], [81, 91]],

function zipper(ctx, ramp, y0, y1) {
  for (let y = y0; y < y1; y++) px(ctx, 80, y, 1, 1, y % 2 ? '#a6acb4' : ramp[0]);
  px(ctx, 79, y0 + 4, 3, 1, '#c3c8cf');

}

function clothesDetail(ctx, v, cl, ramp) {

    for (let y = 60; y <= 77; y++) {
      const half = Math.max(0, Math.round((77 - y) * 0.5));

      '.kkkk.',

    for (let i = 0; i <= 7; i++) {

      px(ctx, 89 - i - Math.max(1, 6 - i) + 1, y, Math.max(1, 6 - i), 1, ramp[4]);

    line(ctx, 90, 59, 81, 67, ramp[0]);
    line(ctx, 70, 59, 72, 65, ramp[0]);
    line(ctx, 90, 59, 88, 65, ramp[0]);
    line(ctx, 72, 65, 79, 67, ramp[1]);
    line(ctx, 88, 65, 81, 67, ramp[1]);

function buttons(ctx, v, kind) {

// 시계 확대 창: 위장 스마트워치 단서(바늘이 지금 시각과 다름)는 여기서 본다
function watchInset(ctx, w) {
  const x = 4;
  const y = 60;
  panel(ctx, x - 1, y - 1, 25, 25);
  const cx = x + 11;
  const cy = y + 11;
  if (w.type === 'digital') {
    px(ctx, x + 3, y + 6, 17, 11, '#3a3a42');
    px(ctx, x + 4, y + 7, 15, 9, C.lcd);
    stamp(ctx, x + 5, y + 9, ['gg.g.gg', 'g..g..g', 'gg.g.gg'].map((r) => r), { g: C.seg });
    return;
  }
  for (let yy = -9; yy <= 9; yy++) {
    for (let xx = -9; xx <= 9; xx++) {
      const d = xx * xx + yy * yy;
      if (d <= 81) px(ctx, cx + xx, cy + yy, 1, 1, d > 64 ? C.bezel : C.face);
    }
  }
  [0, 3, 6, 9].forEach((k) => {
    const a = (k / 12) * Math.PI * 2;
    px(ctx, cx + Math.round(Math.sin(a) * 7), cy - Math.round(Math.cos(a) * 7), 1, 1, C.tick);
  });
  const ma = (w.m / 60) * Math.PI * 2;
  const ha = (((w.h % 12) + w.m / 60) / 12) * Math.PI * 2;
  for (let r = 0; r <= 7; r++) px(ctx, cx + Math.round(Math.sin(ma) * r), cy - Math.round(Math.cos(ma) * r), 1, 1, C.hand);
  for (let r = 0; r <= 4; r++) px(ctx, cx + Math.round(Math.sin(ha) * r), cy - Math.round(Math.cos(ha) * r), 1, 1, C.handR);
}

function pen(ctx, fake, x, y, vertical) {
  if (vertical) {
    for (let i = 0; i < 22; i++) {
      const isCap = i < 7;
      px(ctx, x, y + i, 1, 1, isCap ? C.capHi : C.penHi);
      px(ctx, x + 1, y + i, 2, 1, isCap ? C.cap : C.pen);
    }
    if (!fake) px(ctx, x, y + 7, 3, 2, C.band);
    else px(ctx, x + 1, y, 1, 1, C.lens);
    return;
  }
  for (let i = 0; i < 26; i++) {
    const isCap = i >= 19;
    px(ctx, x + i, y, 1, 1, isCap ? C.capHi : C.penHi);
    px(ctx, x + i, y + 1, 1, 2, isCap ? C.cap : C.pen);
  }
  if (!fake) px(ctx, x + 16, y, 2, 3, C.band);
  else px(ctx, x + 25, y + 1, 1, 1, C.lens);
}

// 책상 위 물건은 위쪽이 좁은 사다리꼴로 찍어 책상 면에 누워 있게 보이게 한다.
function trap(ctx, t, color) {
  for (let y = t.y0; y <= t.y1; y++) {
    const [l, r] = span(t, y);
    px(ctx, l, y, r - l + 1, 1, color);
  }
}

function span(t, y) {
  const k = (y - t.y0) / Math.max(1, t.y1 - t.y0);
  return [Math.round(t.l0 + (t.l1 - t.l0) * k), Math.round(t.r0 + (t.r1 - t.r0) * k)];
}

// 사다리꼴 안의 상대 좌표(u: 0~1 가로, w: 0~1 세로) → 화면 좌표
function at(t, u, w) {
  const y = Math.round(t.y0 + (t.y1 - t.y0) * w);
  const [l, r] = span(t, y);
  return [Math.round(l + (r - l) * u), y];
}

const PAPER = { y0: 99, y1: 118, l0: 48, r0: 86, l1: 43, r1: 91 };
const OMR = { y0: 99, y1: 118, l0: 120, r0: 152, l1: 117, r1: 156 };
const CARD = { y0: 101, y1: 115, l0: 9, r0: 25, l1: 6, r1: 27 };

function desk(ctx, v) {
  if (v.paper !== 'none') {
    // 문제지
    trap(ctx, { ...PAPER, y0: PAPER.y0 + 1, y1: PAPER.y1 + 1 }, C.paperEdge);
    trap(ctx, PAPER, C.paper);
    const [hx, hy] = at(PAPER, 0.08, 0.08);
    px(ctx, hx, hy, 14, 2, '#8a919c');
    for (let w = 0.3; w < 0.95; w += 0.16) {
      const [x0, y] = at(PAPER, 0.08, w);
      const [x1] = at(PAPER, 0.85 - ((w * 37) % 0.2), w);
      px(ctx, x0, y, x1 - x0, 1, C.print);
    }
    if (v.paper === 'scribbled') {
      [[0.15, 0.3, 0.4, 0.5, 0.6, 0.35], [0.5, 0.6, 0.7, 0.45, 0.9, 0.6], [0.1, 0.75, 0.3, 0.9, 0.45, 0.7], [0.55, 0.85, 0.7, 0.75, 0.88, 0.9]].forEach(([a, b, c, d, e, f]) => {
        const p1 = at(PAPER, a, b);
        const p2 = at(PAPER, c, d);
        const p3 = at(PAPER, e, f);
        line(ctx, p1[0], p1[1], p2[0], p2[1], C.pencil);
        line(ctx, p2[0], p2[1], p3[0], p3[1], C.pencil);
      });
      const [cx, cy] = at(PAPER, 0.75, 0.12);
      stamp(ctx, cx, cy, ['.pp.', 'p..p', '.pp.'], { p: C.pencil });
    }
    // OMR 카드
    trap(ctx, { ...OMR, y0: OMR.y0 + 1, y1: OMR.y1 + 1 }, C.omrEdge);
    trap(ctx, OMR, C.omr);
    trap(ctx, { ...OMR, y1: OMR.y0 + 1 }, C.omrLine);
    const filled = Math.round(v.omr * 20);
    let k = 0;
    for (let col = 0; col < 4; col++) {
      const u = 0.06 + col * 0.24;
      const top = at(OMR, u, 0.12);
      const bot = at(OMR, u, 0.95);
      line(ctx, top[0], top[1], bot[0], bot[1], C.omrLine);
      for (let row = 0; row < 5; row++) {
        const [x, y] = at(OMR, u + 0.04, 0.2 + row * 0.17);
        px(ctx, x, y, 5, 1, '#efb2c2');
        if (k < filled) px(ctx, x + ((k * 5) % 3) + 1, y - 1, 2, 2, C.mark);
        k++;
      }
    }
  }
  // 수험표
  trap(ctx, { ...CARD, y0: CARD.y0 + 1, y1: CARD.y1 + 1 }, C.cardEdge);
  trap(ctx, CARD, C.card);
  trap(ctx, { ...CARD, y1: CARD.y0 + 2 }, C.cardHead);
  const [px0, py0] = at(CARD, 0.12, 0.35);
  px(ctx, px0, py0, 6, 7, C.photoBg);
  const [lx, ly] = at(CARD, 0.55, 0.4);
  px(ctx, lx, ly, 7, 1, C.print);
  px(ctx, lx, ly + 3, 5, 1, C.print);
}

// ---------- 공용 틀 (모든 학생이 같은 틀을 쓰고 색만 바꾼다) ----------
// 틀의 각 칸에는 실제 색 대신 'C0'~'C4'(옷), 'K0'~'K4'(피부), 'H0'~'H4'(머리), 'W0'~'W4'(책상) 같은 자리표시가 들어간다.
const SLOT = (k) => [0, 1, 2, 3, 4].map((i) => `${k}${i}`);
const TEMPLATE_CACHE = new Map();

function capsule(r, p, x0, y0, x1, y1, rad) {
  const dx = x1 - x0;
  const dy = y1 - y0;
  const len2 = dx * dx + dy * dy;
  r.fill(p, Math.floor(Math.min(x0, x1) - rad), Math.floor(Math.min(y0, y1) - rad), Math.ceil(Math.max(x0, x1) + rad), Math.ceil(Math.max(y0, y1) + rad), (x, y) => {
    const t = Math.max(0, Math.min(1, ((x + 0.5 - x0) * dx + (y + 0.5 - y0) * dy) / len2));
    const ex = x + 0.5 - (x0 + dx * t);
    const ey = y + 0.5 - (y0 + dy * t);
    return ex * ex + ey * ey <= rad * rad;
  });
}

// 굵기가 변하는 팔다리: (x0,y0)에서 반지름 r0, (x1,y1)에서 r1
function limb(r, p, x0, y0, r0, x1, y1, r1) {
  const dx = x1 - x0;
  const dy = y1 - y0;
  const len2 = dx * dx + dy * dy;
  const m = Math.max(r0, r1);
  r.fill(p, Math.floor(Math.min(x0, x1) - m), Math.floor(Math.min(y0, y1) - m), Math.ceil(Math.max(x0, x1) + m), Math.ceil(Math.max(y0, y1) + m), (x, y) => {
    const t = Math.max(0, Math.min(1, ((x + 0.5 - x0) * dx + (y + 0.5 - y0) * dy) / len2));
    const ex = x + 0.5 - (x0 + dx * t);
    const ey = y + 0.5 - (y0 + dy * t);
    const rad = r0 + (r1 - r0) * t;
    return ex * ex + ey * ey <= rad * rad;
  });
}

function toMap(r) {
  const map = new Array(CLOSE_W * CLOSE_H).fill(null);
  r.render((x, y, c) => { map[y * CLOSE_W + x] = c; });
  return map;
}

function template(key, build) {
  if (!TEMPLATE_CACHE.has(key)) {
    const r = makeRaster(CLOSE_W, CLOSE_H);
    build(r);
    TEMPLATE_CACHE.set(key, toMap(r));
  }
  return TEMPLATE_CACHE.get(key);
}

// 얼굴형: 턱이 좁아지는 정도와 너비
const FACE_SHAPE = {
  oval: { rx: 20.5, narrow: 0.32, pow: 2 },
  round: { rx: 21, narrow: 0.18, pow: 2 },
  square: { rx: 20, narrow: 0.12, pow: 3 },
  narrow: { rx: 19, narrow: 0.36, pow: 2 },
};

// 몸 뒤쪽 층: 몸통(옷 실루엣 포함), 목, 귀, 머리, 책상, 책상 위가 아닌 팔
function bodyTemplate(pose, sleeves, waist, kind, shape, earsHidden) {
  const raised = pose === 'glasses' || pose === 'ear';
  return template(`body|${pose}|${sleeves}|${waist}|${kind}|${shape}|${earsHidden}`, (r) => {
    const cloth = SLOT('C');
    const skin = SLOT('K');
    // 몸통과 위팔을 한 덩어리로: 목에서 완만하게 내려오는 어깨선 → 둥근 어깨 끝 → 곧게 내려오는 팔 바깥선
    const pTorso = r.part(cloth);
    r.fill(pTorso, 30, 56, 130, 99, (x, y) => {
      const ax = Math.abs(x + 0.5 - 80);
      // 팔꿈치 쪽 바깥 모서리를 둥글게
      const limit = y > 88 ? 37 - (y - 88) * 0.55 : 37;
      // 오른팔을 들어 올린 자세면 오른쪽은 팔 없이 몸통만
      if (raised && x > 80 && y > 73 && ax > 31) return false;
      if (ax > limit) return false;
      let top;
      if (ax <= 9) top = 59.5;
      else if (ax <= 27) top = 59.5 + (ax - 9) * 0.3;
      else top = 64.9 + (1 - Math.sqrt(Math.max(0, 1 - ((ax - 27) / 10) ** 2))) * 10;
      return y >= top;
    });
    if (waist) r.ellipse(pTorso, 117, 90, 6, 6);
    // 옷 종류별 실루엣: 후드는 목 뒤로 접힌 모자, 패딩은 세운 깃
    if (kind === 'hoodie') {
      const pHood = r.part(cloth);
      r.fill(pHood, 56, 48, 104, 68, (x, y) => {
        const out = ((x + 0.5 - 80) / 23) ** 2 + ((y + 0.5 - 62) / 9) ** 2 <= 1;
        const hole = ((x + 0.5 - 80) / 13) ** 2 + ((y + 0.5 - 61) / 6) ** 2 <= 1;
        return out && !hole;
      });
    }
    if (kind === 'padding') {
      const pCollar = r.part(cloth);
      r.round(pCollar, 66, 53, 28, 11, 4);
    }
    // 목

const cache = { sig: null, canvas: null };

function signature(state) {

      cache.canvas.height = SCENE_H;

      const { x: sx, desk } = seatPos(seat);
      if (Math.abs(x - sx) <= 24 && y >= desk - 34 && y <= desk + 16) return seat;

  return null;
}

$('btn-copy').addEventListener('click', async (ev) => {
  const b = ev.currentTarget;
  try { await navigator.clipboard.writeText(String(state.room)); b.textContent = `복사됨 · ${state.room}`; }
  catch (e) { b.textContent = `시험실 번호 ${state.room}`; }
});
$('btn-card').addEventListener('click', async () => {
  try { await document.fonts.load('20px "Galmuri11"'); await document.fonts.load('700 20px "Galmuri11"'); } catch (e) { /* 기본 글꼴 */ }
  const canvas = renderCard(state);
  $('card-img').src = canvas.toDataURL('image/png');
  cardBlob = null;
  canvas.toBlob((b) => { cardBlob = b; });
  $('card-overlay').hidden = false;
});
$('btn-close-card').addEventListener('click', () => { $('card-overlay').hidden = true; });
$('btn-share').addEventListener('click', async (ev) => {
  const b = ev.currentTarget;
  const text = `수능 감독관 ${state.result.grade}등급 · ${state.result.title}. 시험실 ${state.room}에서 붙어 보자.`;
  try {
    const file = cardBlob ? new File([cardBlob], `suneung-${state.room}.png`, { type: 'image/png' }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
    if (navigator.share) { await navigator.share({ text }); return; }
    throw new Error('no share');
  } catch (e) {
    b.textContent = '이미지를 길게 눌러 저장하세요';
  }
});

// ---------- 그리기 ----------
let lastDraw = 0;
function drawNow(t = performance.now()) {
  if (state && state.phase !== 'result') drawScene(sceneCtx, state, { t, selected, reduceMotion });
}
function frame(t) {
  if (state && !$('game').hidden && t - lastDraw > 90) { lastDraw = t; drawNow(t); }
  requestAnimationFrame(frame);
}

// ---------- 부팅 ----------
function boot(data) {
  if (data && data.state && data.state.v === 3) {
    state = data.state;
    selected = data.selected || null;
    viewing = data.viewing != null ? data.viewing : null;
    showScreen(state.phase === 'result' ? 'result' : 'game');
    render();
  } else {
    showScreen('title');
    const r = roomFromHash();
    if (r) $('room-input').value = String(r);
  }
  requestAnimationFrame(frame);
}

const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ state, selected, viewing }));
if (hot && hot.ready) hot.ready(boot);
else boot(hot && hot.data ? hot.data : {});

return {  };
})();
})();
</script>
