<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수능 감독관</title>
<meta name="description" content="2027학년도 수능 시험실에서 부정행위자를 찾아내는 도트 텍스트 게임">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- app:start -->
<div class="app">
  <section id="title" class="screen">
    <div class="box intro">
      <p class="dim">2027학년도 수능 · 11월 19일</p>
      <h1>수능 감독관</h1>
      <p>수험생 12명 중 누군가는 <b>오래 준비해 왔다</b>.</p>
    </div>
    <div class="box">
      <label class="field" for="room-input">시험실 번호</label>
      <input id="room-input" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="비우면 무작위">
      <div class="menu">
        <button id="start-btn" class="item main" type="button">감독 시작</button>
        <button id="how-btn" class="item" type="button" aria-expanded="false">규칙</button>
      </div>
    </div>
    <div id="how" class="box rules" hidden>
      <p><b>08:10~08:40</b> 30분 안에 수험생을 점검한다.</p>
      <p><b>교시마다</b> 본인 확인하고 순회한다. 수상하면 의심 표시.</p>
      <p><b>쉬는 시간</b> 의심 수험생을 정밀 점검한다. 헛짚으면 민원.</p>
      <p><b>같은 번호</b>면 친구와 같은 판이다.</p>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <div class="box hud" role="status">
      <span id="hud-time" class="time"></span>
      <span id="hud-phase"></span>
      <span id="hud-budget" class="dim"></span>
      <span id="hud-complaints"></span>
    </div>
    <canvas id="scene" width="240" height="204" aria-label="시험실. 수험생을 눌러 고르세요."></canvas>
    <div id="seat-grid" class="seat-grid" role="group" aria-label="좌석 선택"></div>
    <div class="box viewer">
      <div class="viewer-head"><span id="v-title"></span><span id="v-time" class="dim"></span></div>
      <canvas id="closeup" width="160" height="120" aria-label="가까이 본 모습"></canvas>
      <div id="v-insets" class="insets"></div>
      <p id="v-caption" class="v-caption"></p>
    </div>
    <div id="actions" class="actions"></div>
    <div id="album-box" class="box album-box" hidden>
      <p class="dim small">수첩 · 눌러서 다시 보기</p>
      <div id="album" class="album"></div>
    </div>
    <div class="box ticker">
      <ol id="ticker"></ol>
    </div>
  </section>

  <section id="result" class="screen" hidden>
    <div class="box result-head">
      <p class="dim">시험실 <span id="r-room"></span> 감독 결과</p>
      <p class="grade"><span id="r-grade"></span>등급</p>
      <p id="r-title" class="r-title"></p>
      <p id="r-stats" class="dim"></p>
    </div>
    <canvas id="result-scene" width="240" height="204" aria-hidden="true"></canvas>
    <div class="box">
      <h2>진실</h2>
      <ol id="r-truth" class="truth"></ol>
    </div>
    <div class="box menu">
      <button id="btn-card" class="item" type="button">결과 카드 만들기</button>
      <button id="btn-retry" class="item" type="button">같은 시험실 다시</button>
      <button id="btn-new" class="item" type="button">새 시험실</button>
      <button id="btn-copy" class="item" type="button">시험실 번호 복사</button>
    </div>
  </section>

  <div id="card-overlay" class="overlay" hidden>
    <div class="overlay-inner">
      <img id="card-img" alt="감독 결과 카드">
      <p class="dim">이미지를 길게 누르거나 오른쪽 클릭해서 저장하세요.</p>
      <div class="box menu">
        <button id="btn-share" class="item" type="button">공유하기</button>
        <button id="btn-close-card" class="item" type="button">닫기</button>
      </div>
    </div>
  </div>
</div>
<!-- app:end -->
<script type="module" src="src/main.js"></script>
</body>
</html>
